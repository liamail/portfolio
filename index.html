<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liam Rayner Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet">
<script>window.LR={calmUntil:0};if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('pre-enter')</script>
<style>
:root{
  /* Layout idea: a left-aligned column of big type; the work index is a multi-track
     timeline under a viewer; work pages carry a chapter scrubber that follows the scroll. */
  --paper:#f4f4f8;
  --panel:#e8e8f1;
  --ink:#0c0c18;
  --muted:#565769;
  --line:#d3d4e1;
  --accent:#4f46e5;
  --primary:#4a38d6;
  --primary-ink:#ffffff;
  --accent-ink:#ffffff;
  --accent-soft:#dcdafa;
  --exp:#d98a1f;
  --exp-soft:#f6e3c2;
  --stage:#0d0d1b;
  --bezel:#20202f;
  --glow-1:#e3d9f9; --glow-2:#dadbfa; --glow-3:#d5e3f9;
  --grain-1:#7a4fe0; --grain-2:#4f46e5; --grain-3:#3a7bdc; --grain-a:.3;
  --font:"Avenir Next","Avenir","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#08080f; --panel:#11111f; --ink:#ececf6; --muted:#a0a2ba; --line:#222338;
    --accent:#918bff; --accent-ink:#08080f; --accent-soft:#232258; --primary:#5b4ae8; --primary-ink:#ffffff;
    --exp:#f0b454; --exp-soft:#4b3a1b; --stage:#10101f; --bezel:#222231;
    --glow-1:#1a1239; --glow-2:#161739; --glow-3:#101e38;
    --grain-1:#a98bff; --grain-2:#918bff; --grain-3:#7fb0ff; --grain-a:.34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#08080f; --panel:#11111f; --ink:#ececf6; --muted:#a0a2ba; --line:#222338;
  --accent:#918bff; --accent-ink:#08080f; --accent-soft:#232258; --primary:#5b4ae8; --primary-ink:#ffffff;
  --exp:#f0b454; --exp-soft:#4b3a1b; --stage:#10101f; --bezel:#222231;
    --glow-1:#1a1239; --glow-2:#161739; --glow-3:#101e38;
    --grain-1:#a98bff; --grain-2:#918bff; --grain-3:#7fb0ff; --grain-a:.34;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* Motion system: one ease for things arriving and moving, one for dissolves, three durations. */
:root{--ease:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.4,0,.2,1);--t-fast:.2s;--t-move:.52s;--t-slow:.8s}
body{overflow-x:clip}
html{-webkit-tap-highlight-color:transparent;overflow-anchor:none}
/* Entrance: the hero rises in once, as the splash clears. */
html.pre-enter .home .hero>*,html.pre-enter .home .tabs-in{opacity:0;transform:translateY(16px)}
html.entering .home .hero>*,html.entering .home .tabs-in{transition:opacity var(--t-slow) var(--ease),transform var(--t-slow) var(--ease)}
html.entering .home .hero>:nth-child(1){transition-delay:.1s}
html.entering .home .hero>:nth-child(2){transition-delay:.2s}
html.entering .home .tabs-in{transition-delay:.32s}
/* Project page: the title and intro follow the visual in. */
@keyframes rise{from{opacity:0}to{opacity:1}}
.arrive .work-head>*{animation:rise .5s var(--ease) both}
.arrive .work-head>:nth-child(1){animation-delay:.08s}
.arrive .work-head>:nth-child(2){animation-delay:.14s}
.arrive .work-head>:nth-child(3){animation-delay:.2s}
.arrive .chapters{animation:rise .6s var(--ease) .24s both}
/* Work preview: the old visual fades away over the new one. */
#vstage{display:grid}
#vstage>.stage{grid-area:1/1}
#vstage>.stage.off{visibility:hidden;pointer-events:none}
#vstage>.stage.leaving{z-index:1;pointer-events:none;animation:fade-away .34s var(--ease-io) forwards}
@keyframes fade-away{to{opacity:0}}
/* Press feedback on touch. */
.card a{transition:opacity var(--t-fast) var(--ease)}
.card a:active{opacity:.75}
.prow:active .pt{opacity:.6}
.tabs a:active{transform:scale(.96)}
.linkish:active,.back:active{opacity:.6}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit}
img,video{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
:root{--gutter:clamp(16px,4vw,40px);--tabs-top:calc(var(--gutter) - 3px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--gutter)}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:16px}
.num{font-variant-numeric:tabular-nums}

/* Background: irregular violet, indigo and blue glows that drift, turn and stretch very slowly.
   The grain canvas is kept but switched off (see GRAIN in the last script). */
.wash{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wash i{position:absolute;left:0;top:0;width:84vmax;height:84vmax;margin:-42vmax 0 0 -42vmax;will-change:transform,opacity}
.wash i:nth-child(1){transform:translate3d(82vw,14vh,0) rotate(20deg);
  background:radial-gradient(34% 28% at 36% 44%,var(--glow-1),transparent),radial-gradient(30% 36% at 62% 58%,var(--glow-1),transparent)}
.wash i:nth-child(2){transform:translate3d(12vw,84vh,0) rotate(-30deg);
  background:radial-gradient(40% 22% at 50% 38%,var(--glow-2),transparent),radial-gradient(24% 30% at 44% 64%,var(--glow-2),transparent)}
.wash i:nth-child(3){transform:translate3d(56vw,58vh,0) rotate(50deg);
  background:radial-gradient(46% 22% at 50% 50%,var(--glow-3),transparent),radial-gradient(18% 18% at 70% 34%,var(--glow-3),transparent)}
.wash i:nth-child(4){transform:translate3d(18vw,16vh,0) rotate(-10deg);opacity:.6;
  background:radial-gradient(30% 34% at 40% 50%,var(--glow-3),transparent),radial-gradient(26% 24% at 62% 46%,var(--glow-1),transparent)}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{display:none}
.fx #fx{display:block}
.fx .wash,.fx .veil{display:none}
.hole-on,.hole-on body{cursor:grab}
.hole-drag,.hole-drag *{cursor:grabbing!important;-webkit-user-select:none!important;user-select:none!important}
.wrap{position:relative;z-index:1}

/* Splash */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--paper) 80%,transparent);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);animation:sp-in .4s ease both}
.splash[hidden]{display:none}
.splash.out{animation:sp-out .8s var(--ease-io) both;pointer-events:none}
.splash.out .sp-card{animation:sp-card-out .8s var(--ease-io) both}
.sp-card{width:min(480px,100%);padding:clamp(8px,2vw,16px);color:var(--ink);animation:sp-card .5s var(--ease) both}
.sp-card:focus{outline:none}
.sp-card .mark{margin-bottom:24px}
.sp-card .mark svg{height:clamp(34px,4.4vw,44px)}
.sp-card h2{font-size:clamp(1.9rem,4.4vw,2.5rem);line-height:1.15;letter-spacing:-.02em;font-weight:600}
.sp-card p{margin-top:12px;color:var(--muted);line-height:1.5}
.sp-btn{margin-top:28px;font:inherit;font-weight:600;font-size:1rem;color:var(--primary-ink);background:var(--primary);border:0;border-radius:8px;padding:11px 26px;cursor:pointer;transition:transform .15s}
.sp-btn:hover{filter:brightness(1.1)}
.sp-btn:active{transform:scale(.97)}
.sp-btn:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
@keyframes sp-in{from{opacity:0}to{opacity:1}}
@keyframes sp-out{to{opacity:0;-webkit-backdrop-filter:blur(0) saturate(1);backdrop-filter:blur(0) saturate(1)}}
@keyframes sp-card-out{to{opacity:0;transform:translateY(-8px);filter:blur(6px)}}
@keyframes sp-card{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.splash-open{overflow:hidden}

/* Home: hero, tabs, panel */
.home{padding-top:var(--pad,22vh)}
.mark{margin-bottom:calc(clamp(22px,3vw,36px) + 24px);color:var(--ink)}
.mark svg{display:block;height:clamp(40px,5vw,54px);width:auto}
.hero h1.intro-line{font-size:clamp(1.95rem,4.1vw,3.3rem);line-height:1.18;letter-spacing:-.025em;font-weight:500;max-width:21em;text-wrap:pretty}
.intro-line .me{color:var(--primary)}
:root[data-theme=dark] .intro-line .me{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .intro-line .me{color:var(--accent)}}
.hero h1{font-size:clamp(2.6rem,7.4vw,5.6rem);line-height:1.02;letter-spacing:-.035em;font-weight:600;max-width:11.5em;text-wrap:balance}
.mark-base{color:var(--primary)}
.tabs{position:sticky;top:var(--tabs-top);z-index:10;display:flex;margin-top:calc(clamp(22px,3vw,36px) + 24px);margin-bottom:var(--pad,22vh);pointer-events:none}
.tabs-in{position:relative;display:inline-flex;gap:2px;padding:3px;margin-left:-3px;border-radius:12px;pointer-events:auto;
  background:color-mix(in srgb,var(--paper) 66%,transparent);
  border:1px solid var(--primary);
  -webkit-backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);
  transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.tabs a{position:relative;z-index:1;font-size:1rem;font-weight:600;text-decoration:none;color:var(--ink);padding:9px 18px;border-radius:7px;transition:color var(--t-fast),transform var(--t-fast) var(--ease)}
.tabs a:hover{color:var(--primary)}
.tabs a[aria-current="page"],.tabs a[aria-current="page"]:hover{color:var(--primary-ink)}
.tab-ind{position:absolute;left:0;top:3px;bottom:3px;width:0;border-radius:8px;background:var(--primary);opacity:0;transform:translateX(0);transition:transform var(--t-move) var(--ease),width var(--t-move) var(--ease),opacity .2s}
.tabs.live .tab-ind{opacity:1}
.panel{position:relative;min-height:70vh;margin-inline:calc(-1 * var(--bleed,0px));overflow:hidden;overflow:clip}
.pane{padding:clamp(20px,3vw,36px) var(--bleed,0px) clamp(80px,12vw,140px)}
.pane[data-pane="work"]{--side:-1}
.pane[data-pane="about"]{--side:1}
.panel .reel{margin-top:0}
.panel .about-head{padding-top:0}
.panel .about-head h2{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.04;letter-spacing:-.03em;font-weight:600;max-width:14em;text-wrap:balance}

/* Project list with hover preview. Rows never change height: the active title only scales. */
/* The panel runs edge to edge (it bleeds out over the page margins and pads its content back in)
   and clips everything inside it, so the hidden section parked off screen can never be scrolled
   to sideways and never adds to the page's length. */
.pane.off{position:absolute;left:0;right:0;top:var(--k,0px);transform:translate3d(calc(var(--side) * 100vw),0,0);pointer-events:none}
.pane.pushing-out{transform:translate3d(calc(var(--side) * 100vw),0,0);transition:transform .42s cubic-bezier(.6,0,.8,.35);pointer-events:none}
.pane.arriving{transform:translate3d(calc(var(--side) * 100vw),0,0);transition:none}
.pane.landing{transform:translate3d(0,0,0);transition:transform .52s cubic-bezier(.16,.9,.24,1)}
.panel .viewer{grid-template-columns:max-content minmax(0,1fr);align-items:center;gap:clamp(20px,3vw,40px)}
/* The Work section fills the screen under the floating tabs, with its contents centred in it. */
@media (min-width:821px){
  .pane[data-pane="work"]{min-height:calc(100vh - var(--tabs-h,50px) - var(--tabs-top) - 12px);min-height:calc(100svh - var(--tabs-h,50px) - var(--tabs-top) - 12px);padding:0 var(--bleed,0px) 12px;display:grid;align-content:center}
  .pane[data-pane="work"] .viewer .stage{height:clamp(440px,62vh,640px)}
}
.plist{display:grid;align-content:center}
/* An invisible copy of each title at its enlarged size sets the column width, so the hovered
   title always fits and the visual takes exactly what is left. */
.prow .pt{white-space:nowrap;width:max-content}
.prow .pg{display:block;height:0;overflow:hidden;visibility:hidden;white-space:nowrap;font-family:var(--display);font-variation-settings:"opsz" 24;font-size:calc(1.3rem * 1.42);letter-spacing:0}
.prow{display:block;padding:11px 0;text-decoration:none;color:var(--muted);transition:color .2s}
.prow .pt{display:block;font-size:1.25rem;line-height:1.2;font-weight:600;letter-spacing:-.015em;transform-origin:left center;transition:transform .28s var(--ease)}
.prow .pk{display:block;margin-top:5px;font-size:.84rem;opacity:.8;transition:opacity .2s}
.prow.is-active{color:var(--ink)}
.prow.is-active .pt{transform:scale(1.42)}
.prow.is-active .pk{color:var(--primary);opacity:1}
:root[data-theme=dark] .prow.is-active .pk{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .prow.is-active .pk{color:var(--accent)}}
.prow.soon{display:block;opacity:.5;cursor:default;border-top:0;padding:11px 0;gap:0}
.vsum{margin-top:16px;min-height:3.2em;color:var(--muted);max-width:34em}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0}
.brand{display:block;color:var(--ink);text-decoration:none;border-radius:8px}
.brand svg{display:block;height:38px;width:auto;transition:transform .22s var(--ease)}
.brand:hover svg{transform:scale(1.06)}
.brand:active svg{transform:scale(.96)}
.nav{display:flex;align-items:center;gap:clamp(14px,3vw,28px)}
.nav a,.linkish{position:relative;text-decoration:none;font-weight:500;padding:4px 0}
.nav a::after,.linkish::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .22s var(--ease)}
.nav a:hover::after,.nav a[aria-current="page"]::after,.linkish:hover::after{transform:scaleX(1)}
.copy{font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line);transition:background-color .18s,border-color .18s,color .18s}
.copy:hover{border-color:var(--ink)}
.copy[data-done]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:560px){.top .copy{display:none}}

/* Intro */
.intro{padding:clamp(36px,8vw,104px) 0 0}
.intro h1{font-size:clamp(2.6rem,7.4vw,5.6rem);line-height:1.02;letter-spacing:-.035em;font-weight:600;max-width:11.5em;text-wrap:balance}
.lede{margin-top:clamp(18px,3vw,28px);font-size:clamp(1.1rem,1.8vw,1.3rem);line-height:1.45;color:var(--muted);max-width:33em}

/* Reel: viewer + timeline (wide screens) */
.reel{margin-top:clamp(44px,7vw,88px)}
.viewer{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,56px);align-items:end}
.viewer-text{padding-bottom:6px}
.kind{color:var(--muted);font-size:.95rem}
.viewer-text h2{font-size:clamp(1.9rem,3.4vw,2.9rem);line-height:1.05;letter-spacing:-.03em;font-weight:600;margin-top:10px;text-wrap:balance}
.viewer-text .sum{margin-top:14px;color:var(--muted);max-width:26em}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:12px 18px;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;transition:transform .18s var(--ease),background-color .18s}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn:active{transform:scale(.97)}
.btn svg{transition:transform .22s var(--ease)}
.btn:hover svg{transform:translateX(3px)}
.swap{animation:swap .28s var(--ease)}
@keyframes swap{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Stage and devices */
.stage{position:relative;background:var(--stage);border-radius:20px;padding:clamp(20px,4vw,44px);display:flex;justify-content:center;align-items:center;gap:clamp(12px,3vw,28px);overflow:hidden}
/* Device frames. The frame is drawn as an outline outside the screen, so the screen keeps the
   recording's exact proportions. Corners are sized from the device's own width (cqw), which keeps
   them circular and keeps the frame's outer curve concentric with the screen's. */
.device{position:relative;flex:none;container-type:inline-size}
.device .scr{position:relative;display:block;width:100%;height:100%;overflow:hidden;background:#000}
/* A still of the first frame sits over each video and only fades once the video is actually
   drawing frames. iPhone shows black while a video starts, and in page transitions, so the still
   covers both. */
.device .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.device .scr.live .still{opacity:0;transition:opacity .22s var(--ease-io)}
.device video{display:block;width:100%;height:100%;object-fit:cover}
.device.phone{width:min(100%,280px);--b:2.2cqw;--r:10cqw}
.device.phone .scr{border-radius:var(--r);box-shadow:0 0 0 var(--b) var(--bezel),0 18px 50px rgba(0,0,0,.35)}
.device.wide{width:100%}
.device.wide .scr{border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.stage.row .device.phone{flex:1 1 0;min-width:0;max-width:250px;width:auto}
.viewer .stage{height:440px;padding:28px}
.viewer .stage .device.phone{height:100%;width:auto}
.pp{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;opacity:0;transition:opacity .18s,background-color .18s}
.stage:hover .pp,.pp:focus-visible,.pp[aria-pressed="true"]{opacity:1}
.pp:hover{background:rgba(255,255,255,.28)}
.pp::before{content:"";width:10px;height:12px;border-left:3px solid #fff;border-right:3px solid #fff}
.pp[aria-pressed="true"]::before{width:0;height:0;border:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
@media (hover:none){.pp{opacity:1}}

/* Timeline */
.tl{margin-top:20px;background:var(--panel);border-radius:16px;padding:12px 16px 16px;display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:8px;user-select:none;-webkit-user-select:none}
.tl-labels{padding-top:30px;display:grid;gap:6px;align-content:start;color:var(--muted);font-size:.85rem}
.tl-labels span{height:44px;display:flex;align-items:center}
.tl-body{position:relative;cursor:ew-resize}
.ruler{position:relative;height:30px}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tick span{position:absolute;left:8px;top:4px;font-size:.8rem;color:var(--muted)}
.lanes{position:relative;display:grid;gap:6px}
.lane{position:relative;height:44px;background:var(--paper);border-radius:10px}
.clip{position:absolute;top:5px;bottom:5px;display:flex;align-items:center;padding:0 9px;border-radius:8px;font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;background:var(--accent-soft);color:var(--ink);cursor:pointer;transition:background-color .18s,color .18s,box-shadow .18s}
.clip:hover{box-shadow:0 0 0 2px var(--accent)}
.clip.is-active{background:var(--accent);color:var(--accent-ink)}
.clip.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-weight:500;cursor:default}
.clip.ghost:hover{box-shadow:none}
.clip.key{width:30px;padding:0;justify-content:center;background:transparent;overflow:visible;transform:translateX(-15px)}
.clip.key:hover{box-shadow:none}
.clip.key i{width:15px;height:15px;transform:rotate(45deg);border-radius:3px;background:var(--exp-soft);border:2px solid var(--exp);transition:transform .2s var(--ease),background-color .18s}
.clip.key:hover i{transform:rotate(45deg) scale(1.18)}
.clip.key.is-active i{background:var(--exp);transform:rotate(45deg) scale(1.18)}
.ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);pointer-events:none;z-index:3;transition:left .5s var(--ease)}
.ph.live{transition:none}
.ph.sweep{transition:left 1.3s var(--ease)}
.ph::before{content:"";position:absolute;top:0;left:-5px;width:12px;height:14px;border-radius:3px 3px 6px 6px;background:var(--ink)}
.ph b{position:absolute;top:-2px;left:14px;font-size:.75rem;font-weight:600;background:var(--ink);color:var(--paper);padding:2px 7px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ph.flip b{left:auto;right:14px}
.hint{margin-top:10px;font-size:.85rem;color:var(--muted)}

/* Cards (small screens) */
.cards{display:none;gap:36px}
.card a{display:grid;gap:14px;text-decoration:none}
.card h2{font-size:1.6rem;line-height:1.1;letter-spacing:-.025em;font-weight:600}
.card .sum{color:var(--muted);margin-top:6px}
.card h2{margin-top:4px}
.card .stage{transition:transform .25s var(--ease)}
.card a:active .stage{transform:scale(.985)}
.soon{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted)}
.soon strong{color:var(--ink);font-weight:600}
@media (max-width:820px){
  .viewer,.tl,.hint{display:none}
  .cards{display:grid}
}

/* Work page */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.back svg{transition:transform .22s var(--ease)}
.back:hover svg{transform:translateX(-3px)}
.work-head{padding:calc(var(--tabs-top) + var(--nav-h) + clamp(24px,4vw,48px)) 0 0}
.work-head h1{margin-top:0!important}
/* Floating controls share one spot, one size and one look: the Work/About tabs on the home page,
   a square back button on project pages. */
:root{--nav-h:calc(1rem * 1.55 + 26px);--navx:calc(var(--gutter) - 3px)}
.navback{position:fixed;z-index:30;top:var(--tabs-top);left:var(--navx);display:grid;place-items:center;width:var(--nav-h);height:var(--nav-h);border-radius:12px;color:var(--ink);text-decoration:none;
  background:color-mix(in srgb,var(--paper) 66%,transparent);border:1px solid var(--primary);
  -webkit-backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);
  transform:translateZ(0);transition:background-color var(--t-fast),color var(--t-fast),transform var(--t-fast) var(--ease)}
.navback svg{transition:transform .22s var(--ease)}
.navback:hover{background:var(--primary);color:var(--primary-ink)}
.navback:hover svg{transform:translateX(-2px)}
.navback:active{transform:scale(.94)}
.navback:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
/* (A sideways push between the tabs and the back button is parked for now; both simply come in
   with the page's fade.) */
.work-head h1{font-size:clamp(2.4rem,6.4vw,4.8rem);line-height:1.02;letter-spacing:-.035em;font-weight:600;margin-top:clamp(20px,4vw,40px);max-width:12em;text-wrap:balance}
.thesis{margin-top:18px;font-size:clamp(1.15rem,2vw,1.4rem);line-height:1.4;color:var(--muted);max-width:30em}
.work-head h1 .yr{font-family:"Avenir Next","Avenir","Figtree",system-ui,sans-serif;font-variation-settings:normal;font-size:.26em;font-weight:400;letter-spacing:0;line-height:1;color:var(--primary);vertical-align:baseline;position:static;margin-left:1.15em;white-space:nowrap}
:root[data-theme=dark] .work-head h1 .yr{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .work-head h1 .yr{color:var(--accent)}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.meta{margin-top:clamp(28px,4vw,44px);padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px 28px}
.meta dt{font-size:.88rem;color:var(--muted)}
.meta dd{font-weight:500;margin-top:2px}
.hero{margin-top:clamp(28px,4vw,44px)}
.home .hero{margin-top:0}
.fig figcaption{margin-top:10px;font-size:.9rem;color:var(--muted);max-width:44em}
.chapters{margin-top:clamp(40px,6vw,72px)}
.chapter{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:20px clamp(24px,5vw,64px);padding:clamp(36px,5vw,60px) 0;border-top:1px solid var(--line)}
.chapter h2{font-size:1.5rem;line-height:1.15;letter-spacing:-.02em;font-weight:600;position:sticky;top:calc(var(--tabs-top) + var(--nav-h) + 28px);align-self:start;text-wrap:balance}
.chapter .body{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-width:0}
.chapter .body p{max-width:38em}
.chapter .fig{margin:10px 0}
.pts{display:grid;gap:10px;max-width:38em}
.pts li{position:relative;padding-left:20px}
.pts li::before{content:"";position:absolute;left:0;top:.72em;width:9px;height:2px;border-radius:2px;background:var(--accent)}
.pts strong{font-weight:600}
.quote{border-left:3px solid var(--accent);padding-left:20px;max-width:34em}
.quote p{font-size:1.35rem;line-height:1.35;font-weight:500;letter-spacing:-.01em}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:.9rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px 28px;max-width:44em}
.facts b{display:block;font-size:2.1rem;line-height:1;letter-spacing:-.03em;font-weight:600;font-variant-numeric:tabular-nums}
.facts span{display:block;margin-top:8px;color:var(--muted);font-size:.95rem}
@media (max-width:760px){
  .chapter{grid-template-columns:minmax(0,1fr)}
  .chapter h2{position:static}
}
@media (max-width:560px){
  .facts{grid-template-columns:minmax(0,1fr);gap:14px}
  .facts div{display:grid;grid-template-columns:7.6rem minmax(0,1fr);gap:14px;align-items:baseline}
  .facts b{font-size:1.7rem;white-space:nowrap}
  .facts span{margin-top:0}
}
.cards .device.phone{width:min(100%,210px)}
.next{display:block;text-decoration:none;border-top:1px solid var(--line);padding:clamp(36px,6vw,72px) 0}
.next small{display:block;color:var(--muted);font-size:.95rem}
.next strong{display:inline-flex;align-items:center;gap:16px;margin-top:8px;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;letter-spacing:-.035em;font-weight:600}
.next svg{transition:transform .28s var(--ease)}
.next:hover svg{transform:translateX(10px)}
.has-dock{padding-bottom:96px}

/* Chapter scrubber */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(540px,calc(100% - 32px));z-index:20;color:var(--ink);border-radius:12px;padding:10px 12px 12px;
  background:color-mix(in srgb,var(--paper) 42%,transparent);border:1px solid var(--primary);
  -webkit-backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);backdrop-filter:blur(22px) saturate(1.8) brightness(1.04)}
.dock{bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
@media (max-width:820px){.dock{bottom:calc(28px + env(safe-area-inset-bottom, 0px))}}
.dock-top{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;font-weight:600}
.dock-top span:last-child{opacity:.6;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.dock-track{position:relative;display:flex;gap:3px;margin-top:8px;height:16px}
.seg{height:100%;min-width:6px;border-radius:4px;background:var(--ink);opacity:.16;transition:opacity .2s,background-color .2s}
.seg:hover{opacity:.4}
.seg.past{opacity:.4}
.seg.now{opacity:1;background:var(--primary)}
.dock-ph{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px;pointer-events:none}

/* Timeline demo */
.tdemo{background:var(--panel);border-radius:16px;padding:14px;user-select:none;-webkit-user-select:none}
.td-view{position:relative;height:150px;border-radius:10px;background:var(--stage);color:#fff;overflow:hidden;display:grid;place-items:center;transition:background-color .25s}
.td-view strong{font-size:1.6rem;font-weight:600;letter-spacing:-.02em}
.td-chips{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.td-chips span{font-size:.78rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--exp);color:#1a1205}
.td-time{position:absolute;right:12px;top:10px;font-size:.8rem;opacity:.7;font-variant-numeric:tabular-nums}
.td-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:12px 0 10px}
.td-btn{font-size:.88rem;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);transition:background-color .18s,color .18s,border-color .18s,transform .15s}
.td-btn:active{transform:scale(.96)}
.td-btn[hidden]{display:none}
.td-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.td-sp{flex:1}
.td-tracks{position:relative;touch-action:pan-y}
.td-ruler{position:relative;height:22px;cursor:ew-resize;touch-action:none}
.td-ruler i{position:absolute;top:4px;font-style:normal;font-size:.72rem;color:var(--muted);padding-left:5px;border-left:1px solid var(--line);height:14px;line-height:14px;font-variant-numeric:tabular-nums}
.td-els{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.td-els.open{grid-template-rows:1fr}
.td-els>div{overflow:hidden;min-height:0}
.td-row{position:relative;background:var(--paper);border-radius:8px;margin-bottom:5px}
.td-row.el{height:30px}.td-row.main{height:46px}.td-row.aud{height:20px;margin-bottom:0;overflow:hidden}
.td-clip{position:absolute;top:3px;bottom:3px;border-radius:7px;display:flex;align-items:center;padding:0 9px;font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;transition:left .2s var(--ease),width .2s var(--ease),box-shadow .15s}
.td-clip.drag{transition:box-shadow .15s;cursor:grabbing;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.td-clip.sc{background:var(--accent-soft);color:var(--ink)}
.td-clip.sc b{margin-left:8px;font-size:.7rem;padding:1px 6px;border-radius:999px;background:var(--exp-soft);color:var(--ink);transition:opacity .2s}
.td-els.open~.td-row.main .td-clip.sc b{opacity:0}
.td-clip.ov{background:var(--exp-soft);color:var(--ink);border:1px solid var(--exp)}
.td-clip.ov.loose{border-style:dashed}
.td-trim{position:absolute;right:0;top:0;bottom:0;width:12px;cursor:ew-resize;touch-action:none}
.td-trim::after{content:"";position:absolute;right:4px;top:30%;bottom:30%;width:2px;border-radius:2px;background:currentColor;opacity:.45}
.td-wave{position:absolute;inset:4px 0;border-radius:5px;background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 5px);opacity:.35;transition:width .2s}
.td-ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);pointer-events:none;z-index:4}
.td-ph::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:2px 2px 5px 5px;background:var(--ink)}

/* About */
.about-head{padding:clamp(36px,8vw,96px) 0 0}
.about-head h1{font-size:clamp(2.4rem,6.4vw,4.8rem);line-height:1.02;letter-spacing:-.035em;font-weight:600;max-width:12em;text-wrap:balance}
.bio{margin-top:clamp(24px,4vw,40px);display:grid;gap:18px;max-width:38em;font-size:1.15rem;line-height:1.5}
.bio .looking{font-weight:600}
.rows{display:grid}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;padding:14px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:0}
.rows span{color:var(--muted)}
.rows em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.quotes{display:grid;gap:28px}
.reach{list-style:none;display:grid;gap:14px;justify-items:start}
.rl{display:inline-flex;align-items:center;gap:14px;font:inherit;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.rl-t{font-family:var(--display);font-variation-settings:"opsz" 24;font-weight:400;font-size:clamp(1.6rem,2.6vw,2rem);line-height:1.1;overflow-wrap:anywhere;transition:color .2s}
.rl-i{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;color:var(--ink);border:1px solid var(--primary);background:color-mix(in srgb,var(--paper) 42%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);transition:background-color .2s,color .2s,transform .25s var(--ease)}
.rl:hover,.rl:focus-visible,.rl.done{color:var(--ink)}
.rl:hover .rl-i,.rl:focus-visible .rl-i,.rl.done .rl-i{background:var(--primary);color:var(--primary-ink)}
.rl:hover .rl-i{transform:translateX(3px)}
.rl:active .rl-i{transform:scale(.94)}
.rl:focus-visible{outline:none}
.rl:focus-visible .rl-i{outline:2px solid var(--primary);outline-offset:3px}
.rl-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.contact-line{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.contact-line .addr{font-weight:600;overflow-wrap:anywhere}

/* Footer */
.foot[hidden]{display:none}
.foot{margin-top:clamp(56px,9vw,120px);border-top:1px solid var(--line);padding:28px 0 40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px 28px;color:var(--muted);font-size:.95rem}
.foot .contact-line{color:var(--ink)}

/* View transitions */
::view-transition-group(hero-media){animation-duration:.5s;animation-timing-function:var(--ease)}
/* Tabs returning to the home page: hidden through the page change, then eased in. */
.tabs-in.wait{opacity:0;transform:translate3d(0,-8px,0)}
.tabs-in.reveal{transition:opacity .35s var(--ease),transform .45s var(--ease)}
/* The old page holds still underneath while the new one fades in over it: no moment where both
   are half see-through, so no dip or flash. */
::view-transition-old(root){animation:none}
::view-transition-new(root){animation:page-in .3s var(--ease) both}
@keyframes page-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  .wash i{animation:none!important}
}
/* Display type: Hedvig Letters Serif is a single weight, so titles use 400 and never a synthesised bold. Its optical size runs 12 to 24, and titles use the top of that range. */
:root{--display:"Hedvig Letters Serif","Iowan Old Style","Georgia",serif}
.hero h1.intro-line,.hero h1,.intro h1,.sp-card h2,.panel .about-head h2,.about-head h1,.viewer-text h2,.card h2,.work-head h1,.chapter h2,.prow .pt{font-family:var(--display);font-weight:400;font-variation-settings:"opsz" 24}
.hero h1.intro-line{letter-spacing:-.012em;line-height:1.14}
.work-head h1,.about-head h1,.panel .about-head h2,.sp-card h2{letter-spacing:-.015em;line-height:1.06}
.card h2,.viewer-text h2{letter-spacing:-.01em}
.chapter h2{letter-spacing:-.005em;font-size:1.6rem}
.prow .pt{letter-spacing:0;font-size:1.3rem}
</style>
</head>

      '<div class="td-bar"><button class="td-btn" type="button" data-a="play">Play</button>' +
      '<button class="td-btn" type="button" data-a="full" aria-pressed="false">Full timeline</button>' +
      '<button class="td-btn" type="button" data-a="link" aria-pressed="true" hidden>Smart linking on</button><span class="td-sp"></span>' +
      '<button class="td-btn" type="button" data-a="reset">Reset</button></div>' +
      '<div class="td-tracks"><div class="td-ruler"></div><div class="td-els"><div><div class="td-row el"></div><div class="td-row el"></div></div></div>' +
      '<div class="td-row main"></div><div class="td-row aud"><div class="td-wave"></div></div><div class="td-ph"></div></div>';
    const q = sel => el.querySelector(sel), tracks = q('.td-tracks'), ruler = q('.td-ruler'), rows = el.querySelectorAll('.td-row.el'), mainRow = q('.td-row.main');
    const view = q('.td-view'), nodes = {};
    for (let t = 0; t < SPAN; t += 2) ruler.insertAdjacentHTML('beforeend', '<i style="left:' + (t / SPAN * 100) + '%">' + t + 's</i>');

    const sceneAt = t => { let a = 0; for (const s of st.scenes) { if (t < a + s.d) return s; a += s.d; } return st.scenes[st.scenes.length - 1]; };
    const pxs = () => tracks.clientWidth / SPAN;
    function build(){
      mainRow.innerHTML = ''; rows.forEach(r => { r.innerHTML = ''; });

        n.setAttribute('role', 'button'); n.innerHTML = '<span></span><b></b><i class="td-trim" data-trim="' + s.id + '"></i>'; mainRow.appendChild(n); nodes[s.id] = n; });
      st.els.forEach(e => { const n = document.createElement('div'); n.className = 'td-clip ov'; n.tabIndex = 0; n.dataset.el = e.id; n.setAttribute('role', 'button'); n.textContent = e.label; rows[e.row].appendChild(n); nodes['e' + e.id] = n; });
    }
    // With linking on, every element keeps its place inside its scene. With it off, elements stay at
    // their old time on the clock, which is how a reorder leaves them over the wrong footage.
    // Smart linking is always on in the simple view; the switch only exists in the full timeline.

    function relink(e){ const s = sceneAt(e.t); e.scene = s.id; e.off = e.t - startOf(s.id); }
    const relinkAll = () => st.els.forEach(relink);
    function update(){
      const k = 100 / SPAN; let t = 0;
      st.scenes.forEach(s => {
        const n = nodes[s.id], count = st.els.filter(e => e.scene === s.id).length;
        if (!(drag && drag.kind === 'scene' && drag.id === s.id)) n.style.left = t * k + '%';
        n.style.width = 'calc(' + s.d * k + '% - 3px)';
        n.firstChild.textContent = s.name; n.children[1].textContent = count ? count + (count === 1 ? ' element' : ' elements') : ''; n.children[1].style.display = count ? '' : 'none';
        n.setAttribute('aria-label', s.name + ' scene, ' + s.d + ' seconds. Arrow keys reorder.');
        t += s.d;
      });
      st.els.forEach(e => { const n = nodes['e' + e.id]; n.style.left = e.t * k + '%'; n.style.width = 'calc(' + e.d * k + '% - 2px)';
        const home = sceneAt(e.t).id === e.scene && e.t < total();
        n.classList.toggle('loose', !eff() && !home); n.setAttribute('aria-label', e.label + ' element at ' + e.t.toFixed(1) + ' seconds. Arrow keys move.'); });
      q('.td-wave').style.width = total() * k + '%';
      if (ph > total()) ph = total();
      paint();
    }
    function paint(){
      q('.td-ph').style.left = ph / SPAN * 100 + '%';
      const s = sceneAt(Math.min(ph, total() - 0.001));
      view.style.backgroundColor = HUES['abcd'.indexOf(s.id)];
      view.children[1].textContent = s.name;
      view.children[0].textContent = ph.toFixed(1) + 's of ' + total().toFixed(0) + 's';
      view.children[2].innerHTML = st.els.filter(e => ph >= e.t && ph < e.t + e.d).map(e => '<span>' + esc(e.label) + '</span>').join('');
    }
    function setPlay(on){ playing = on; q('[data-a="play"]').textContent = on ? 'Pause' : 'Play'; cancelAnimationFrame(raf); if (on) { last = performance.now(); raf = requestAnimationFrame(tick); } }
    function tick(now){ ph += (now - last) / 1000; last = now; if (ph >= total()) ph = 0; paint(); raf = requestAnimationFrame(tick); }
    function move(id, dir){ const i = st.scenes.findIndex(s => s.id === id), j = i + dir; if (j < 0 || j >= st.scenes.length) return false; const s = st.scenes.splice(i, 1)[0]; st.scenes.splice(j, 0, s); settle(); return true; }

    el.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'play') setPlay(!playing);
      if (a === 'full') { full = !full; b.setAttribute('aria-pressed', String(full)); q('.td-els').classList.toggle('open', full); q('[data-a="link"]').hidden = !full; if (eff()) relinkAll(); update(); }
      if (a === 'link') { link = !link; b.setAttribute('aria-pressed', String(link)); b.textContent = link ? 'Smart linking on' : 'Smart linking off'; if (link) relinkAll(); update(); }
      if (a === 'reset') { st = fresh(); ph = 0; build(); update(); }
    });
    el.addEventListener('keydown', e => {
      const dir = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0; if (!dir) return;
      const sc = e.target.closest('[data-scene]'), ov = e.target.closest('[data-el]');
      if (sc) { e.preventDefault(); if (eff()) relinkAll(); if (move(sc.dataset.scene, dir)) { mainRow.insertBefore(sc, dir < 0 ? sc.previousSibling : sc.nextSibling && sc.nextSibling.nextSibling); update(); sc.focus(); } }
      if (ov) { e.preventDefault(); const it = st.els.find(x => x.id === +ov.dataset.el); it.t = Math.max(0, Math.min(SPAN - it.d, it.t + dir * 0.5)); relink(it); update(); }
    });
    el.addEventListener('pointerdown', e => {
      if (e.button) return;
      const trim = e.target.closest('[data-trim]'), sc = e.target.closest('[data-scene]'), ov = e.target.closest('[data-el]'), rl = e.target.closest('.td-ruler');
      if (!trim && !sc && !ov && !rl) return;
      e.preventDefault(); setPlay(false);

      if (rl) drag = { kind: 'scrub' };
      else if (trim) { const s = st.scenes.find(v => v.id === trim.dataset.trim); drag = { kind: 'trim', s, d0: s.d }; }
      else if (sc) { if (eff()) relinkAll(); drag = { kind: 'scene', id: sc.dataset.scene, x0, left0: sc.getBoundingClientRect().left - box.left, node: sc }; sc.classList.add('drag'); }

  }

  /* ---------- about ---------- */
  function aboutHTML(){
    const a = SITE.about;
    return '<article>' +
      '<header class="about-head"><h2>' + esc(a.headline) + '</h2>' +
      '<div class="bio">' + a.bio.map(p => '<p>' + esc(p) + '</p>').join('') + (a.looking ? '<p class="looking">' + esc(a.looking) + '</p>' : '') + '</div></header>' +
      '<div class="chapters">' +
        (FLAGS.aboutHow ? '<section class="chapter"><h2>How I work</h2><div class="body"><ul class="pts">' + a.how.map(h => '<li><strong>' + esc(h[0]) + '</strong> ' + esc(h[1]) + '</li>').join('') + '</ul></div></section>' : '') +
        '<section class="chapter"><h2>From colleagues</h2><div class="body"><div class="quotes">' + a.quotes.map(q => '<blockquote class="quote"><p>' + esc(q.text) + '</p><cite>' + esc(q.who) + '</cite></blockquote>').join('') + '</div></div></section>' +

      '</div></article>';

  /* ---------- routing ---------- */
  function parse(hash){

    if (h.indexOf('work-') === 0 && bySlug[h.slice(5)]) return { name: 'item', item: bySlug[h.slice(5)] };

    const run = () => {
      if (location.hash !== hash) location.hash = hash;
      render(hash, opts);
      const d = slug ? visibleStage(slug) : null;
      const pill = main.querySelector('.tabs-in');
      if (d) d.style.viewTransitionName = 'hero-media';
    };
    const revealTabs = () => {
      const pill = main.querySelector('.tabs-in.wait'); if (!pill) return;
      let shown = false;
      const show = () => { if (shown) return; shown = true; pill.classList.add('reveal'); pill.classList.remove('wait'); setTimeout(() => pill.classList.remove('reveal'), 600); };

    };
    // Videos show their stills while the pages change over, so nothing goes black mid-transition.
    cover(); document.querySelectorAll('video').forEach(v => v.pause());
    holdVideos(reduce ? 0 : 650); window.LR.calmUntil = performance.now() + 900;
    if (!document.startViewTransition || reduce) { run(); setTimeout(revealTabs, reduce ? 0 : 200); return; }
    document.querySelectorAll('.stage').forEach(s => { s.style.viewTransitionName = ''; });
    if (slug) { const s = visibleStage(slug); if (s) s.style.viewTransitionName = 'hero-media'; }

    if (location.hash === current) return;

  /* ---------- Get in touch: Email copies the address ---------- */

    const b = e.target.closest('[data-mail]'); if (!b) return;
    const t = b.querySelector('.rl-t'), ic = b.querySelector('.rl-i'), st = b.closest('.body').querySelector('.rl-status');

      // If the browser refuses the clipboard, show the address so it can be copied by hand.
      t.textContent = ok ? 'Copied' : SITE.email;

    };
    try { navigator.clipboard.writeText(SITE.email).then(() => done(true), () => done(false)); } catch (err) { done(false); }
  });

  /* ---------- copy email ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-copy]'); if (!b) return;
    const done = ok => {
      b.textContent = ok ? 'Copied' : SITE.email;
      if (ok) b.setAttribute('data-done', '');
      setTimeout(() => { b.textContent = 'Copy email'; b.removeAttribute('data-done'); }, ok ? 1600 : 4000);
    };
    try { navigator.clipboard.writeText(SITE.email).then(() => done(true), () => done(false)); } catch (err) { done(false); }

  // The back button sits exactly where the tabs' left edge does: the content column's edge.
  const placeNav = () => {

<script>
/* Background. A WebGL layer draws four soft, irregular glows in violet, indigo and blue with a
   fine grain in them, and warps them into a black hole when one is open. Without WebGL the same
   glows are drawn as page elements and there is no black hole. The older drifting-particle grain
   is kept below, switched off (GRAIN). */
(function(){
  const root = document.documentElement;
  const c = document.getElementById('bg'), fxc = document.getElementById('fx');
  if (!c || !c.getContext || !fxc) return;
  const ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const blobs = [].slice.call(document.querySelectorAll('.wash i'));
  const GRAIN = false;                      // set to true to bring the drifting particle grain back
  const G = 40, M = 36, LEVELS = 5, NB = 6;     // four everyday glows, plus two that only appear with the black hole
  let w = 0, h = 0, N = 0, X, Y, S, A, V, D, B, gw = 0, gh = 0, PS, VX, VY, WV, HU;
  let cols = [], glow = [], rim = [0.31, 0.27, 0.9], paper = '', maxA = 0.3, clock = Math.random() * 100, raf = 0, last = 0, ema = 0, frames = 0, tick = 0;

  const P = new Uint8Array(512);
  (function(){ const p = []; for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
    for (let i = 0; i < 512; i++) P[i] = p[i & 255]; })();
  const fade = t => t * t * (3 - 2 * t), mix = (a, b, t) => a + (b - a) * t;
  function noise(x, y, z){
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = fade(x - xi), yf = fade(y - yi), zf = fade(z - zi);
    const X0 = xi & 255, Y0 = yi & 255, Z0 = zi & 255;
    const a = P[X0] + Y0, b = P[X0 + 1] + Y0;
    const aa = P[a] + Z0, ab = P[a + 1] + Z0, ba = P[b] + Z0, bb = P[b + 1] + Z0;
    return mix(mix(mix(P[aa], P[ba], xf), mix(P[ab], P[bb], xf), yf),
               mix(mix(P[aa + 1], P[ba + 1], xf), mix(P[ab + 1], P[bb + 1], xf), yf), zf) / 255;
  }
  const rgb = hex => { const m = /^#([0-9a-f]{6})$/i.exec(hex || ''), v = m ? parseInt(m[1], 16) : 0x8888cc; return [(v >> 16 & 255) / 255, (v >> 8 & 255) / 255, (v & 255) / 255]; };
  function colours(){
    const s = getComputedStyle(root);
    cols = ['--grain-1', '--grain-2', '--grain-3'].map(n => s.getPropertyValue(n).trim());
    glow = ['--glow-1', '--glow-2', '--glow-3'].map(n => rgb(s.getPropertyValue(n).trim()));
    rim = rgb(s.getPropertyValue('--accent').trim());
    maxA = parseFloat(s.getPropertyValue('--grain-a')) || 0.3;
    paper = s.getPropertyValue('--paper').trim();
  }

  /* ---------- WebGL layer ---------- */
  const VERT = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const FRAG = [
    'precision highp float;',
    'uniform vec2 uRes; uniform float uDpr, uTime, uHS, uGrain;',
    'uniform vec3 uHole, uG1, uG2, uG3, uRim;',
    'uniform vec2 uT[6]; uniform mat2 uM[6]; uniform float uOp[6], uBd[6];',
    'float hash(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }',
    'float lobe(vec2 u, vec2 c, vec2 r){ float t = clamp(1. - length((u - c) / r), 0., 1.); return t * t * (3. - 2. * t); }',  // soft edge, no visible outline
    // A cloud being drawn in is bent around the hole: its length follows a circle about the
    // centre instead of a straight line, so a stretched tail wraps the edge as an arc.
    'vec2 bend(vec2 p, vec2 c, float b){',
    '  if (b < .001) return p;',
    '  vec2 d = c - uHole.xy; float r0 = length(d); if (r0 < 1.) return p;',
    '  vec2 v = p - uHole.xy; float da = atan(v.y, v.x) - atan(d.y, d.x);',

    'void add(inout vec4 acc, vec3 col, float a){ acc = acc * (1. - a) + vec4(col * a, a); }',
    // The four glows, each two lobes, in the same shapes as the CSS fallback.

    '  vec4 acc = vec4(0.); vec2 u;',
    '  u = .5 + uM[0] * (bend(p, uT[0], uBd[0]) - uT[0]); add(acc, uG1, lobe(u, vec2(.62,.58), vec2(.30,.36)) * uOp[0]); add(acc, uG1, lobe(u, vec2(.36,.44), vec2(.34,.28)) * uOp[0]);',

    if (e.pointerType === 'mouse' || !pressT) return;
    const dx = e.clientX - pressX, dy = e.clientY - pressY;
    if (dx * dx + dy * dy > 100) clearPress();
  }, { passive: true });
  window.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') letGo(); });
  window.addEventListener('pointercancel', e => { if (e.pointerType !== 'mouse') letGo(); });
  window.addEventListener('pointerdown', e => {
    const dx = e.clientX - hx, dy = e.clientY - hy;
    if (e.pointerType === 'mouse' && e.button === 0 && hActive && hl > 0.4 && dx * dx + dy * dy < (hR + 14) * (hR + 14)) {
      drag = true; tx = e.clientX; ty = e.clientY; root.classList.add('hole-drag'); e.preventDefault();
    } else rest();
  });
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  document.addEventListener('selectstart', e => { if (drag) e.preventDefault(); });
  window.addEventListener('scroll', () => { window.LR.calmUntil = Math.max(window.LR.calmUntil, performance.now() + 220); if (!drag && !tHeld) rest(); }, { passive: true });
  window.addEventListener('keydown', () => { endDrag(); rest(); });
  window.addEventListener('blur', () => { endDrag(); rest(false); });
  root.addEventListener('pointerleave', () => { if (!drag && !tHeld) rest(false); });
  start();
})();
</script>
<script>
(function(){
  const FLAGS = { splash: true };
  // The hero waits hidden (see pre-enter) and rises in as the splash clears, or straight away with no splash.
  const root = document.documentElement;
  const enter = () => {
    if (!root.classList.contains('pre-enter')) return;
    root.classList.add('entering');
    // Two frames lets the hidden state paint first so the rise animates; the timer is a fallback.
    const show = () => root.classList.remove('pre-enter');
    requestAnimationFrame(() => requestAnimationFrame(show)); setTimeout(show, 60);
    setTimeout(() => root.classList.remove('entering'), 1600);
  };
  const box = document.getElementById('splash'); if (!box || !FLAGS.splash) { enter(); return; }
  const tpl = document.getElementById('logo-tpl'), ok = document.getElementById('sp-ok');
  document.getElementById('sp-mark').innerHTML = tpl ? tpl.innerHTML : '';
  document.body.appendChild(box); // keep it outside the page wrapper so it is not made inert with it
  const sib = [...document.body.children].filter(e => e !== box && e.tagName !== 'SCRIPT' && e.tagName !== 'TEMPLATE');
  sib.forEach(e => e.setAttribute('inert', ''));
  box.hidden = false; document.body.classList.add('splash-open');
  // Focus the dialog itself, not the button, so no focus ring shows on load. Tab still lands on the button.
  box.querySelector('.sp-card').focus({ preventScroll: true });
  const close = () => {
    document.removeEventListener('keydown', key);
    sib.forEach(e => e.removeAttribute('inert')); document.body.classList.remove('splash-open');
    enter();
    const done = () => { box.hidden = true; };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) done(); else { box.classList.add('out'); setTimeout(done, 800); }
  };
  const key = e => { if (e.key === 'Escape') close(); else if (e.key === 'Tab') { e.preventDefault(); ok.focus(); } };
  document.addEventListener('keydown', key); ok.addEventListener('click', close);
})();
</script>
