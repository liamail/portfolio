<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liam Rayner • Product Designer</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet">
<script>window.LR={calmUntil:0};if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('pre-enter')</script>
<style>
:root{
  /* Layout idea: a left-aligned column of big type; the work index is a multi-track
     timeline under a viewer; work pages carry a chapter scrubber that follows the scroll. */
  --paper:#f4f4f8;
  --panel:#e8e8f1;
  --ink:#0c0c18;
  --muted:#565769;
  --line:#d3d4e1;
  --accent:#4f46e5;
  --primary:#4a38d6;
  --primary-ink:#ffffff;
  --accent-ink:#ffffff;
  --accent-soft:#dcdafa;
  --exp:#d98a1f;
  --exp-soft:#f6e3c2;
  --stage:#0d0d1b;
  --bezel:#20202f;
  --glow-1:#e3d9f9; --glow-2:#dadbfa; --glow-3:#d5e3f9;
  --grain-1:#7a4fe0; --grain-2:#4f46e5; --grain-3:#3a7bdc; --grain-a:.3;
  --font:"Avenir Next","Avenir","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#08080f; --panel:#11111f; --ink:#ececf6; --muted:#a0a2ba; --line:#222338;
    --accent:#918bff; --accent-ink:#08080f; --accent-soft:#232258; --primary:#5b4ae8; --primary-ink:#ffffff;
    --exp:#f0b454; --exp-soft:#4b3a1b; --stage:#10101f; --bezel:#222231;
    --glow-1:#1a1239; --glow-2:#161739; --glow-3:#101e38;
    --grain-1:#a98bff; --grain-2:#918bff; --grain-3:#7fb0ff; --grain-a:.34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#08080f; --panel:#11111f; --ink:#ececf6; --muted:#a0a2ba; --line:#222338;
  --accent:#918bff; --accent-ink:#08080f; --accent-soft:#232258; --primary:#5b4ae8; --primary-ink:#ffffff;
  --exp:#f0b454; --exp-soft:#4b3a1b; --stage:#10101f; --bezel:#222231;
    --glow-1:#1a1239; --glow-2:#161739; --glow-3:#101e38;
    --grain-1:#a98bff; --grain-2:#918bff; --grain-3:#7fb0ff; --grain-a:.34;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* Motion system: one ease for things arriving and moving, one for dissolves, three durations. */
:root{--ease:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.4,0,.2,1);--t-fast:.2s;--t-move:.52s;--t-slow:.8s}
body{overflow-x:clip}
html{-webkit-tap-highlight-color:transparent;overflow-anchor:none}
/* Entrance: the hero rises in once, as the splash clears. */
html.pre-enter .home .hero>*,html.pre-enter .home .tabs-in{opacity:0;transform:translateY(16px)}
html.entering .home .hero>*,html.entering .home .tabs-in{transition:opacity var(--t-slow) var(--ease),transform var(--t-slow) var(--ease)}
html.entering .home .hero>:nth-child(1){transition-delay:.1s}
html.entering .home .hero>:nth-child(2){transition-delay:.2s}
html.entering .home .tabs-in{transition-delay:.32s}
/* Project page: the title and intro follow the visual in. */
@keyframes rise{from{opacity:0}to{opacity:1}}
.arrive .work-head>*{animation:rise .5s var(--ease) both}
.arrive .work-head>:nth-child(1){animation-delay:.08s}
.arrive .work-head>:nth-child(2){animation-delay:.14s}
.arrive .work-head>:nth-child(3){animation-delay:.2s}
.arrive .chapters{animation:rise .6s var(--ease) .24s both}
/* Work preview: the chosen project fades in on top. Whatever is underneath holds exactly as it
   is until the new one fully covers it, then drops away unseen, so moving quickly down the list
   never cuts. */
#vstage{display:grid}
#vstage>.stage{grid-area:1/1;opacity:1;transition:opacity .34s var(--ease-io)}
#vstage>.stage.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity 0s linear .36s,visibility 0s linear .36s}
#vstage>.stage.enter{opacity:0;transition:none}
@keyframes fade-away{to{opacity:0}}
/* Press feedback on touch. */
.card a{transition:opacity var(--t-fast) var(--ease)}
.card a:active{opacity:.75}
.prow:active .pt{opacity:.6}
.tabs a:active{transform:scale(.96)}
.linkish:active,.back:active{opacity:.6}
/* A press only shows for a tap: it waits a beat before dimming, and a sideways swipe between
   Work and About cancels it (see swiping in the swipe code). */
@media (hover:none){.card a:active,.card a:active .stage,.prow:active .pt{transition-delay:70ms}}
.swiping .card a:active,.swiping .prow:active .pt,.swiping .linkish:active{opacity:1}
.swiping .card a:active .stage{transform:none}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit}
img,video{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
:root{--gutter:clamp(16px,4vw,40px);--tabs-top:calc(var(--gutter) - 3px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--gutter)}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:16px}
.num{font-variant-numeric:tabular-nums}

/* Background: irregular violet, indigo and blue glows that drift, turn and stretch very slowly.
   The grain canvas is kept but switched off (see GRAIN in the last script). */
.wash{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wash i{position:absolute;left:0;top:0;width:84vmax;height:84vmax;margin:-42vmax 0 0 -42vmax;will-change:transform,opacity}
.wash i:nth-child(1){transform:translate3d(82vw,14vh,0) rotate(20deg);
  background:radial-gradient(34% 28% at 36% 44%,var(--glow-1),transparent),radial-gradient(30% 36% at 62% 58%,var(--glow-1),transparent)}
.wash i:nth-child(2){transform:translate3d(12vw,84vh,0) rotate(-30deg);
  background:radial-gradient(40% 22% at 50% 38%,var(--glow-2),transparent),radial-gradient(24% 30% at 44% 64%,var(--glow-2),transparent)}
.wash i:nth-child(3){transform:translate3d(56vw,58vh,0) rotate(50deg);
  background:radial-gradient(46% 22% at 50% 50%,var(--glow-3),transparent),radial-gradient(18% 18% at 70% 34%,var(--glow-3),transparent)}
.wash i:nth-child(4){transform:translate3d(18vw,16vh,0) rotate(-10deg);opacity:.6;
  background:radial-gradient(30% 34% at 40% 50%,var(--glow-3),transparent),radial-gradient(26% 24% at 62% 46%,var(--glow-1),transparent)}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
@supports (height:100lvh){#fx{bottom:auto;height:100lvh}}
#fx{display:none}
.fx #fx{display:block}
.fx .wash,.fx .veil{display:none}
.hole-on,.hole-on body{cursor:grab}
.hole-drag,.hole-drag *{cursor:grabbing!important;-webkit-user-select:none!important;user-select:none!important}
.wrap{position:relative;z-index:1}

/* Splash */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--paper) 80%,transparent);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);animation:sp-in .4s ease both}
.splash[hidden]{display:none}
.splash.out{animation:sp-out .8s var(--ease-io) both;pointer-events:none}
.splash.out .sp-card{animation:sp-card-out .8s var(--ease-io) both}
.sp-card{width:min(480px,100%);padding:clamp(8px,2vw,16px);color:var(--ink);animation:sp-card .5s var(--ease) both}
.sp-card:focus{outline:none}
.sp-card .mark{margin-bottom:24px}
.sp-card .mark svg{height:clamp(34px,4.4vw,44px)}
.sp-card h2{font-size:clamp(1.9rem,4.4vw,2.5rem);line-height:1.15;letter-spacing:-.02em;font-weight:600}
.sp-card p{margin-top:12px;color:var(--muted);line-height:1.5}
.sp-btn{margin-top:28px;font:inherit;font-weight:600;font-size:1rem;color:var(--primary-ink);background:var(--primary);border:0;border-radius:8px;padding:11px 26px;cursor:pointer;transition:transform .15s}
.sp-btn:hover{filter:brightness(1.1)}
.sp-btn:active{transform:scale(.97)}
.sp-btn:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
@keyframes sp-in{from{opacity:0}to{opacity:1}}
@keyframes sp-out{to{opacity:0;-webkit-backdrop-filter:blur(0) saturate(1);backdrop-filter:blur(0) saturate(1)}}
@keyframes sp-card-out{to{opacity:0;transform:translateY(-8px);filter:blur(6px)}}
@keyframes sp-card{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.splash-open{overflow:hidden}

/* Home: hero, tabs, panel */
.home{padding-top:var(--pad,22vh)}
.mark{margin-bottom:calc(clamp(22px,3vw,36px) + 24px);color:var(--ink)}
.mark svg{display:block;height:clamp(40px,5vw,54px);width:auto}
.hero h1.intro-line{font-size:clamp(1.95rem,4.1vw,3.3rem);line-height:1.18;letter-spacing:-.025em;font-weight:500;max-width:21em;text-wrap:pretty}
.intro-line .me{color:var(--primary)}
:root[data-theme=dark] .intro-line .me{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .intro-line .me{color:var(--accent)}}
.hero h1{font-size:clamp(2.6rem,7.4vw,5.6rem);line-height:1.02;letter-spacing:-.035em;font-weight:600;max-width:11.5em;text-wrap:balance}
.mark-base{color:var(--primary)}
.tabs{position:sticky;top:var(--tabs-top);z-index:10;display:flex;margin-top:calc(clamp(22px,3vw,36px) + 24px);margin-bottom:var(--pad,22vh);pointer-events:none}
/* Frosted-glass controls. Safari draws the blur behind an element separately from its own
   background, and while that background colour is animating it can paint a stray frame of the
   end colour: a flicker on hover. So a glass control never animates its own background. Its
   hover or active fill is a layer on top (::before below) that only fades in and out, with the
   icon or label above it. Any new glass button should be added to this rule. */
.navback::before,.rl-i::before,.next .go::before{content:"";position:absolute;inset:-1px;border-radius:inherit;background:var(--primary);opacity:0;pointer-events:none;transition:opacity var(--t-fast)}
.rl-i{position:relative}
.tabs-in{position:relative;display:inline-flex;gap:2px;padding:3px;margin-left:-3px;border-radius:12px;pointer-events:auto;
  background:color-mix(in srgb,var(--paper) 66%,transparent);
  border:1px solid var(--primary);
  -webkit-backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);
  transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.tabs a{position:relative;z-index:1;font-size:1rem;font-weight:600;text-decoration:none;color:var(--ink);padding:9px 18px;border-radius:7px;transition:color var(--t-fast),transform var(--t-fast) var(--ease)}
.tabs a:hover{color:var(--primary)}
.tabs a[aria-current="page"],.tabs a[aria-current="page"]:hover{color:var(--primary-ink)}
.tab-ind{position:absolute;left:0;top:3px;bottom:3px;width:0;border-radius:8px;background:var(--primary);opacity:0;transform:translateX(0);transition:transform var(--t-move) var(--ease),width var(--t-move) var(--ease),opacity .2s}
.tabs.live .tab-ind{opacity:1}
.panel{position:relative;min-height:70vh;margin-inline:calc(-1 * var(--bleed,0px));overflow:hidden;overflow:clip}
:root{--page-end:clamp(80px,12vw,140px)}
.pane{padding:clamp(20px,3vw,36px) var(--bleed,0px) var(--page-end);transform:translate3d(0,0,0)}
/* The section keeps one layer for good: Safari redraws a layer's contents whenever it gains or
   loses one, which showed as a flicker on the play buttons at the start and end of a swipe. Each
   button is its own layer too, so the page sliding never redraws it. */
.pp{will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.pane[data-pane="work"]{--side:-1}
.pane[data-pane="about"]{--side:1}
.pane[data-pane="about"] .chapter:last-child{padding-bottom:0}
.panel .reel{margin-top:0}
.panel .about-head{padding-top:0}
.panel .about-head h2{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.04;letter-spacing:-.03em;font-weight:600;max-width:14em;text-wrap:balance}

/* Project list with hover preview. Rows never change height: the active title only scales. */
/* The panel runs edge to edge (it bleeds out over the page margins and pads its content back in)
   and clips everything inside it, so the hidden section parked off screen can never be scrolled
   to sideways and never adds to the page's length. */
.pane.off{position:absolute;left:0;right:0;top:var(--k,0px);transform:translate3d(calc(var(--side) * 100vw),0,0);pointer-events:none}
.pane.pushing-out{transform:translate3d(calc(var(--side) * 100vw),0,0);transition:transform .3s cubic-bezier(.55,0,.75,.3);pointer-events:none}
.pane.pushing-out.flung{transition:transform .26s cubic-bezier(.25,.6,.4,1)}
.panel{touch-action:pan-y pinch-zoom}
.pane.arriving{transform:translate3d(calc(var(--side) * 100vw),0,0);transition:none}
.pane.landing{transform:translate3d(0,0,0);transition:transform .4s cubic-bezier(.16,.9,.24,1)}
/* The visual sits on the left and the list on the right, so scrolling down from the tabs (on the
   left) doesn't drag the cursor across the list. */
.panel .viewer{grid-template-columns:minmax(0,1fr) max-content;align-items:center;gap:clamp(28px,4vw,56px)}
.panel .viewer>.plist{order:2}
/* The Work section fills the screen under the floating tabs, with its contents centred on the
   screen itself: the space the tabs take at the top is matched at the bottom. */
@media (min-width:821px){
  .pane[data-pane="work"]{box-sizing:border-box;min-height:calc(100vh - var(--tabs-h,50px) - var(--tabs-top) - 12px);min-height:calc(100svh - var(--tabs-h,50px) - var(--tabs-top) - 12px);padding:0 var(--bleed,0px) calc(var(--tabs-h,50px) + var(--tabs-top) + 12px);display:grid;align-content:center}
  .pane[data-pane="work"] .viewer .stage{height:clamp(440px,62vh,640px)}
}
.plist{display:grid;align-content:center}
/* An invisible copy of each title at its enlarged size sets the column width, so the hovered
   title always fits and the visual takes exactly what is left. */
.prow .pt{white-space:nowrap;width:max-content}
.prow .pg{display:block;height:0;overflow:hidden;visibility:hidden;white-space:nowrap;font-family:var(--display);font-variation-settings:"opsz" 24;font-size:calc(1.3rem * 1.42);letter-spacing:0}
.prow{display:block;padding:11px 0;text-decoration:none;color:var(--muted);transition:color .2s}
.prow .pt{display:block;font-size:1.25rem;line-height:1.2;font-weight:600;letter-spacing:-.015em;transform-origin:left center;transition:transform .28s var(--ease)}
.prow .pk{display:block;margin-top:5px;font-size:.84rem;opacity:.8;transition:opacity .2s}
.prow.is-active{color:var(--ink)}
.prow.is-active .pt{transform:scale(1.42)}
.prow.is-active .pk{color:var(--primary);opacity:1}
:root[data-theme=dark] .prow.is-active .pk{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .prow.is-active .pk{color:var(--accent)}}
.prow.soon{display:block;opacity:.5;cursor:default;border-top:0;padding:11px 0;gap:0}
.vsum{margin-top:16px;min-height:3.2em;color:var(--muted);max-width:34em}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0}
.brand{display:block;color:var(--ink);text-decoration:none;border-radius:8px}
.brand svg{display:block;height:38px;width:auto;transition:transform .22s var(--ease)}
.brand:hover svg{transform:scale(1.06)}
.brand:active svg{transform:scale(.96)}
.nav{display:flex;align-items:center;gap:clamp(14px,3vw,28px)}
.nav a,.linkish{position:relative;text-decoration:none;font-weight:500;padding:4px 0}
.nav a::after,.linkish::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .22s var(--ease)}
.nav a:hover::after,.nav a[aria-current="page"]::after,.linkish:hover::after{transform:scaleX(1)}
.copy{font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line);transition:background-color .18s,border-color .18s,color .18s}
.copy:hover{border-color:var(--ink)}
.copy[data-done]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:560px){.top .copy{display:none}}

/* Intro */
.intro{padding:clamp(36px,8vw,104px) 0 0}
.intro h1{font-size:clamp(2.6rem,7.4vw,5.6rem);line-height:1.02;letter-spacing:-.035em;font-weight:600;max-width:11.5em;text-wrap:balance}
.lede{margin-top:clamp(18px,3vw,28px);font-size:clamp(1.1rem,1.8vw,1.3rem);line-height:1.45;color:var(--muted);max-width:33em}

/* Reel: viewer + timeline (wide screens) */
.reel{margin-top:clamp(44px,7vw,88px)}
.viewer{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,56px);align-items:end}
.viewer-text{padding-bottom:6px}
.kind{color:var(--muted);font-size:.95rem}
.viewer-text h2{font-size:clamp(1.9rem,3.4vw,2.9rem);line-height:1.05;letter-spacing:-.03em;font-weight:600;margin-top:10px;text-wrap:balance}
.viewer-text .sum{margin-top:14px;color:var(--muted);max-width:26em}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:12px 18px;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;transition:transform .18s var(--ease),background-color .18s}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn:active{transform:scale(.97)}
.btn svg{transition:transform .22s var(--ease)}
.btn:hover svg{transform:translateX(3px)}
.swap{animation:swap .28s var(--ease)}
@keyframes swap{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Stage and devices */
.stage{position:relative;background:var(--stage);border-radius:20px;padding:clamp(20px,4vw,44px);display:flex;justify-content:center;align-items:center;gap:clamp(12px,3vw,28px);overflow:hidden}
/* Device frames. The frame is drawn as an outline outside the screen, so the screen keeps the
   recording's exact proportions. Corners are sized from the device's own width (cqw), which keeps
   them circular and keeps the frame's outer curve concentric with the screen's. */
.device{position:relative;flex:none;container-type:inline-size}
.device .scr{position:relative;display:block;width:100%;height:100%;overflow:hidden;background:#000}
/* A still of the first frame sits over each video and only fades once the video is actually
   drawing frames. iPhone shows black while a video starts, and in page transitions, so the still
   covers both. */
.device .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:0}
/* The still is always painted underneath, so it is decoded and ready the instant a video is set
   aside. The video sits on top and only shows once it is drawing frames. */
.device video{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover;opacity:0}
.device .scr.live video{opacity:1;transition:opacity .22s var(--ease-io)}
.device.phone{width:min(100%,280px);--b:2.2cqw;--r:10cqw}
.device.phone .scr{border-radius:var(--r);box-shadow:0 0 0 var(--b) var(--bezel),0 18px 50px rgba(0,0,0,.35)}
.device.wide{width:100%}
.device.card{width:min(100%,400px)}
.device.card .scr{border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.device.wide .scr{border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.stage.row .device.phone{flex:1 1 0;min-width:0;max-width:250px;width:auto}
.viewer .stage{height:440px;padding:28px}
.viewer .stage .device.phone{height:100%;width:auto}
.viewer .stage .device.card{height:100%;width:auto}
.cards .device.card{width:min(100%,240px)}
/* Play and pause. Every frame plays as one timeline: its videos start together, any that finish
   early hold on their last frame, and all restart when the longest ends. The ring shows how far
   through that timeline the frame is. Frames are dark in both themes, so the control is always
   a solid disc in the frame's own colour with a light icon. Its 4px margin keeps the white
   progress ring clear of whatever footage sits behind it. */
.pp{position:absolute;z-index:3;right:var(--pp-r,12px);bottom:var(--pp-b,12px);width:34px;height:34px;box-shadow:0 0 0 4px var(--stage);padding:0;border:0;border-radius:50%;display:grid;place-items:center;opacity:0;cursor:pointer;color:#fff;
  background:var(--stage);transition:opacity .18s}
.pp-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.pp-ring circle{fill:none;stroke-width:1}
.pp-ring .tr{stroke:rgba(255,255,255,.2);transition:stroke .18s}
.pp:hover .pp-ring .tr{stroke:rgba(255,255,255,.32)}
.pp-ring .pg{stroke:#fff;stroke-dasharray:100;stroke-dashoffset:100}
.pp::before{content:"";width:3px;height:11px;border-left:2.5px solid currentColor;border-right:2.5px solid currentColor}
@keyframes pp-in{from{opacity:0;transform:scale(.9)}}
.stage.pp-in>.pp{animation:pp-in .6s var(--ease) .08s both}
@keyframes pp-pulse{40%{transform:scale(1.14)}}
.pp.pulse{animation:pp-pulse .32s var(--ease)}
.pp[aria-pressed="true"]::before{width:0;height:0;border:0;border-left:10px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.stage:hover .pp,.pp:focus-visible,.pp[aria-pressed="true"]{opacity:1}
@media (hover:none){.pp{opacity:1}}

/* Timeline */
.tl{margin-top:20px;background:var(--panel);border-radius:16px;padding:12px 16px 16px;display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:8px;user-select:none;-webkit-user-select:none}
.tl-labels{padding-top:30px;display:grid;gap:6px;align-content:start;color:var(--muted);font-size:.85rem}
.tl-labels span{height:44px;display:flex;align-items:center}
.tl-body{position:relative;cursor:ew-resize}
.ruler{position:relative;height:30px}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tick span{position:absolute;left:8px;top:4px;font-size:.8rem;color:var(--muted)}
.lanes{position:relative;display:grid;gap:6px}
.lane{position:relative;height:44px;background:var(--paper);border-radius:10px}
.clip{position:absolute;top:5px;bottom:5px;display:flex;align-items:center;padding:0 9px;border-radius:8px;font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;background:var(--accent-soft);color:var(--ink);cursor:pointer;transition:background-color .18s,color .18s,box-shadow .18s}
.clip:hover{box-shadow:0 0 0 2px var(--accent)}
.clip.is-active{background:var(--accent);color:var(--accent-ink)}
.clip.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-weight:500;cursor:default}
.clip.ghost:hover{box-shadow:none}
.clip.key{width:30px;padding:0;justify-content:center;background:transparent;overflow:visible;transform:translateX(-15px)}
.clip.key:hover{box-shadow:none}
.clip.key i{width:15px;height:15px;transform:rotate(45deg);border-radius:3px;background:var(--exp-soft);border:2px solid var(--exp);transition:transform .2s var(--ease),background-color .18s}
.clip.key:hover i{transform:rotate(45deg) scale(1.18)}
.clip.key.is-active i{background:var(--exp);transform:rotate(45deg) scale(1.18)}
.ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);pointer-events:none;z-index:3;transition:left .5s var(--ease)}
.ph.live{transition:none}
.ph.sweep{transition:left 1.3s var(--ease)}
.ph::before{content:"";position:absolute;top:0;left:-5px;width:12px;height:14px;border-radius:3px 3px 6px 6px;background:var(--ink)}
.ph b{position:absolute;top:-2px;left:14px;font-size:.75rem;font-weight:600;background:var(--ink);color:var(--paper);padding:2px 7px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ph.flip b{left:auto;right:14px}
.hint{margin-top:10px;font-size:.85rem;color:var(--muted)}

/* Cards (small screens) */
.cards{display:none;gap:36px}
.card a{display:grid;gap:14px;text-decoration:none}
.card h2{font-size:1.6rem;line-height:1.1;letter-spacing:-.025em;font-weight:600}
.card .sum{color:var(--muted);margin-top:6px}
.card h2{margin-top:4px}
.card .stage{transition:transform .25s var(--ease)}
.card a:active .stage{transform:scale(.985)}
.soon{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted)}
.soon strong{color:var(--ink);font-weight:600}
@media (max-width:820px){
  .viewer,.tl,.hint{display:none}
  .cards{display:grid}
}

/* Work page */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.back svg{transition:transform .22s var(--ease)}
.back:hover svg{transform:translateX(-3px)}
.work-head{padding:calc(var(--tabs-top) + var(--nav-h) + clamp(24px,4vw,48px)) 0 0}
.work-head h1{margin-top:0!important}
/* Floating controls share one size and one look: the Work/About tabs top left on the home page, and
   on a project page, which opens like an overlay, a square close button top right. */
:root{--nav-h:calc(1rem * 1.55 + 26px);--navx:calc(var(--gutter) - 3px);--navxr:calc(var(--gutter) - 3px)}
.navback{position:fixed;z-index:30;top:var(--tabs-top);right:var(--navxr);display:grid;place-items:center;width:var(--nav-h);height:var(--nav-h);border-radius:12px;color:var(--ink);text-decoration:none;
  background:color-mix(in srgb,var(--paper) 66%,transparent);border:1px solid var(--primary);
  -webkit-backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);
  transform:translateZ(0);transition:color var(--t-fast),transform var(--t-fast) var(--ease)}
.navback svg{position:relative;transition:transform .22s var(--ease)}
.navback:hover{color:var(--primary-ink)}
.navback:hover::before{opacity:1}
.navback:hover svg{transform:rotate(90deg)}
.navback:active{transform:scale(.94)}
.navback:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
/* (A sideways push between the tabs and the back button is parked for now; both simply come in
   with the page's fade.) */
.work-head h1{font-size:clamp(2.4rem,6.4vw,4.8rem);line-height:1.02;letter-spacing:-.035em;font-weight:600;margin-top:clamp(20px,4vw,40px);max-width:12em;text-wrap:balance}
.thesis{margin-top:18px;font-size:clamp(1.15rem,2vw,1.4rem);line-height:1.4;color:var(--muted);max-width:30em}
.work-head h1 .yr{font-family:"Avenir Next","Avenir","Figtree",system-ui,sans-serif;font-variation-settings:normal;font-size:.26em;font-weight:400;letter-spacing:0;line-height:1;color:var(--primary);vertical-align:baseline;position:static;margin-left:1.15em;white-space:nowrap}
.card h2 .yr{font-family:"Avenir Next","Avenir","Figtree",system-ui,sans-serif;font-variation-settings:normal;font-size:.39em;font-weight:400;letter-spacing:0;line-height:1;color:var(--primary);vertical-align:baseline;position:static;margin-left:1.15em;white-space:nowrap}
:root[data-theme=dark] .work-head h1 .yr,:root[data-theme=dark] .card h2 .yr{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .work-head h1 .yr,:root:not([data-theme=light]) .card h2 .yr{color:var(--accent)}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.meta{margin-top:clamp(28px,4vw,44px);padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px 28px}
.meta dt{font-size:.88rem;color:var(--muted)}
.meta dd{font-weight:500;margin-top:2px}
.hero{margin-top:clamp(28px,4vw,44px)}
.home .hero{margin-top:0}
.fig figcaption{margin-top:10px;font-size:.9rem;color:var(--muted);max-width:44em}
/* Project pages: one column, so visuals can use the full width; titles sit above each section. */
main > article{padding-bottom:var(--page-end)}
article .chapter{grid-template-columns:minmax(0,1fr);gap:16px}
article .chapter h2{position:static}
article .stage{padding:clamp(14px,2.6vw,32px)}
article .device.phone{width:min(100%,320px)}
article .stage.row .device.phone{max-width:300px}
article .device.card{width:min(100%,480px)}
.stage.zoomable{cursor:zoom-in}
.stage.zoomable:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* Enlarged view */
.lb{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(6,6,14,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:opacity .26s var(--ease-io);cursor:zoom-out}
.lb.on{opacity:1}
.lb-stage{display:flex;justify-content:center;align-items:center;gap:24px}
.lb-stage .device .scr{box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lb-x{position:fixed;top:20px;right:20px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.lb-x:hover{background:rgba(255,255,255,.16)}
html.lb-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){.lb{transition:none}}
/* Project brief and numbers */
.brief{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px clamp(36px,6vw,88px);align-items:start;margin-top:clamp(44px,6vw,80px)}
.brief-ov{font-family:var(--display);font-weight:400;font-variation-settings:"opsz" 24;font-size:clamp(1.35rem,2.2vw,1.85rem);line-height:1.32;letter-spacing:-.01em;text-wrap:pretty}
.did{list-style:none;padding:6px 0 0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px}
.did li{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:.86rem;line-height:1;white-space:nowrap}
.did li.role{background:var(--accent-soft);border-color:transparent;color:var(--primary);font-weight:600}
:root[data-theme=dark] .did li.role{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .did li.role{color:var(--accent)}}
@media (max-width:760px){.brief{grid-template-columns:minmax(0,1fr)}.did{padding-top:0}}
.stats{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin-top:clamp(28px,4vw,48px)}
.stats li{padding:20px 22px 22px;border-radius:16px;background:color-mix(in srgb,var(--paper) 66%,transparent);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);backdrop-filter:blur(22px) saturate(1.8) brightness(1.04)}
.stats b{display:block;font-family:var(--display);font-weight:400;font-variation-settings:"opsz" 24;font-size:clamp(1.75rem,3.2vw,2.4rem);line-height:1.05;letter-spacing:-.012em;font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:8px;color:var(--muted);font-size:.95rem;line-height:1.4;max-width:22em}
.chapters{margin-top:clamp(40px,6vw,72px)}
.chapter{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:20px clamp(24px,5vw,64px);padding:clamp(26px,3.6vw,46px) 0}
.chapter h2{font-size:1.5rem;line-height:1.15;letter-spacing:-.02em;font-weight:600;position:sticky;top:calc(var(--tabs-top) + var(--nav-h) + 28px);align-self:start;text-wrap:balance}
.chapter .body{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-width:0}
.chapter .body p{max-width:38em}
.chapter .fig{margin:10px 0}
.pts{display:grid;gap:10px;max-width:38em}
.pts li{position:relative;padding-left:20px}
.pts li::before{content:"";position:absolute;left:0;top:.72em;width:9px;height:2px;border-radius:2px;background:var(--accent)}
.pts strong{font-weight:600}
.quote{border-left:3px solid var(--accent);padding-left:20px;max-width:34em}
.quote p{font-size:1.35rem;line-height:1.35;font-weight:500;letter-spacing:-.01em}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:.9rem;color:var(--muted)}
.facts{display:grid;max-width:40em;border-bottom:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr);gap:24px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line)}
.facts b{display:block;font-size:1.9rem;line-height:1.1;letter-spacing:-.025em;font-weight:600;font-variant-numeric:tabular-nums}
.facts span{display:block;color:var(--muted);font-size:.98rem;line-height:1.4}
@media (max-width:760px){
  .chapter{grid-template-columns:minmax(0,1fr)}
  .chapter h2{position:static}
}
@media (max-width:560px){
  .facts div{grid-template-columns:minmax(0,1fr);gap:6px;padding:14px 0}
  .facts b{font-size:1.6rem}
}
.cards .device.phone{width:min(100%,210px)}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:clamp(16px,2vw,24px);text-align:right;text-decoration:none;color:var(--ink);padding:clamp(36px,6vw,72px) 0 0}
.next strong{text-wrap:balance}
.next .yr{font-size:max(.9rem,.3em);font-weight:400;letter-spacing:0;line-height:1;color:var(--primary);vertical-align:baseline;margin-right:1.15em;white-space:nowrap}
:root[data-theme=dark] .next .yr{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .next .yr{color:var(--accent)}}
.next strong{display:block;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;letter-spacing:-.035em;font-weight:600}
.next .go{position:relative;flex:none;display:grid;place-items:center;width:var(--nav-h);height:var(--nav-h);border-radius:12px;color:var(--ink);
  background:color-mix(in srgb,var(--paper) 66%,transparent);border:1px solid var(--primary);
  -webkit-backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);
  transform:translateZ(0);transition:color var(--t-fast),transform var(--t-fast) var(--ease)}
.next .go svg{position:relative;transition:transform .22s var(--ease)}
.next:hover .go{color:var(--primary-ink)}
.next:hover .go::before{opacity:1}
.next:hover .go svg{transform:translateX(2px)}
.next:active .go{transform:scale(.94)}
.next:focus-visible{outline:none}
.next:focus-visible .go{outline:2px solid var(--primary);outline-offset:3px}
.has-dock{padding-bottom:96px}

/* Chapter scrubber */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(540px,calc(100% - 32px));z-index:20;color:var(--ink);border-radius:12px;padding:10px 12px 12px;
  background:color-mix(in srgb,var(--paper) 42%,transparent);border:1px solid var(--primary);
  -webkit-backdrop-filter:blur(22px) saturate(1.8) brightness(1.04);backdrop-filter:blur(22px) saturate(1.8) brightness(1.04)}
.dock{bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
@media (max-width:820px){.dock{bottom:calc(28px + env(safe-area-inset-bottom, 0px))}}
.dock-top{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;font-weight:600}
.dock-top span:last-child{opacity:.6;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.dock-track{position:relative;display:flex;gap:3px;margin-top:8px;height:16px}
.seg{height:100%;min-width:6px;border-radius:4px;background:var(--ink);opacity:.16;transition:opacity .2s,background-color .2s}
.seg:hover{opacity:.4}
.seg.past{opacity:.4}
.seg.now{opacity:1;background:var(--primary)}
.dock-ph{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px;pointer-events:none}

/* Timeline demo */
.tdemo{background:var(--panel);border-radius:16px;padding:14px;user-select:none;-webkit-user-select:none}
.td-view{position:relative;height:150px;border-radius:10px;background:var(--stage);color:#fff;overflow:hidden;display:grid;place-items:center;transition:background-color .25s}
.td-view strong{font-size:1.6rem;font-weight:600;letter-spacing:-.02em}
.td-chips{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.td-chips span{font-size:.78rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--exp);color:#1a1205}
.td-time{position:absolute;right:12px;top:10px;font-size:.8rem;opacity:.7;font-variant-numeric:tabular-nums}
.td-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:12px 0 10px}
.td-btn{font-size:.88rem;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);transition:background-color .18s,color .18s,border-color .18s,transform .15s}
.td-btn:active{transform:scale(.96)}
.td-btn[hidden]{display:none}
.td-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.td-sp{flex:1}
.td-tracks{position:relative;touch-action:pan-y}
.td-ruler{position:relative;height:22px;cursor:ew-resize;touch-action:none}
.td-ruler i{position:absolute;top:4px;font-style:normal;font-size:.72rem;color:var(--muted);padding-left:5px;border-left:1px solid var(--line);height:14px;line-height:14px;font-variant-numeric:tabular-nums}
.td-els{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.td-els.open{grid-template-rows:1fr}
.td-els>div{overflow:hidden;min-height:0}
.td-row{position:relative;background:var(--paper);border-radius:8px;margin-bottom:5px}
.td-row.el{height:30px}.td-row.main{height:46px}.td-row.aud{height:20px;margin-bottom:0;overflow:hidden}
.td-clip{position:absolute;top:3px;bottom:3px;border-radius:7px;display:flex;align-items:center;padding:0 9px;font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;transition:left .2s var(--ease),width .2s var(--ease),box-shadow .15s}
.td-clip.drag{transition:box-shadow .15s;cursor:grabbing;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.td-clip.sc{background:var(--accent-soft);color:var(--ink)}
.td-clip.sc b{margin-left:8px;font-size:.7rem;padding:1px 6px;border-radius:999px;background:var(--exp-soft);color:var(--ink);transition:opacity .2s}
.td-els.open~.td-row.main .td-clip.sc b{opacity:0}
.td-clip.ov{background:var(--exp-soft);color:var(--ink);border:1px solid var(--exp)}
.td-clip.ov.loose{border-style:dashed}
.td-trim{position:absolute;right:0;top:0;bottom:0;width:12px;cursor:ew-resize;touch-action:none}
.td-trim::after{content:"";position:absolute;right:4px;top:30%;bottom:30%;width:2px;border-radius:2px;background:currentColor;opacity:.45}
.td-wave{position:absolute;inset:4px 0;border-radius:5px;background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 5px);opacity:.35;transition:width .2s}
.td-ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);pointer-events:none;z-index:4}
.td-ph::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:2px 2px 5px 5px;background:var(--ink)}

/* About */
.about-head{padding:clamp(36px,8vw,96px) 0 0}
.about-head h1{font-size:clamp(2.4rem,6.4vw,4.8rem);line-height:1.02;letter-spacing:-.035em;font-weight:600;max-width:12em;text-wrap:balance}
.bio{margin-top:clamp(24px,4vw,40px);display:grid;gap:18px;max-width:38em;font-size:1.15rem;line-height:1.5}
.bio .looking{font-weight:600}
.rows{display:grid}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;padding:14px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:0}
.rows span{color:var(--muted)}
.rows em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.quotes{display:grid;gap:28px}
.reach{list-style:none;display:grid;gap:14px;justify-items:start}
.rl{display:inline-flex;align-items:center;gap:14px;font:inherit;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.rl-t{font-family:var(--display);font-variation-settings:"opsz" 24;font-weight:400;font-size:clamp(1.6rem,2.6vw,2rem);line-height:1.1;overflow-wrap:anywhere;transition:color .2s}
.rl-i{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;color:var(--ink);border:1px solid var(--primary);background:color-mix(in srgb,var(--paper) 42%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);transition:color .2s,transform .25s var(--ease)}
.rl-i>*{position:relative}
.rl:hover,.rl:focus-visible,.rl.done{color:var(--ink)}
.rl:hover .rl-i,.rl:focus-visible .rl-i,.rl.done .rl-i{color:var(--primary-ink)}
.rl:hover .rl-i::before,.rl:focus-visible .rl-i::before,.rl.done .rl-i::before{opacity:1}
.rl:hover .rl-i{transform:translateX(3px)}
.rl:active .rl-i{transform:scale(.94)}
.rl:focus-visible{outline:none}
.rl:focus-visible .rl-i{outline:2px solid var(--primary);outline-offset:3px}
.rl-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.contact-line{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.contact-line .addr{font-weight:600;overflow-wrap:anywhere}

/* Footer */
.foot[hidden]{display:none}
.foot{margin-top:clamp(56px,9vw,120px);border-top:1px solid var(--line);padding:28px 0 40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px 28px;color:var(--muted);font-size:.95rem}
.foot .contact-line{color:var(--ink)}

/* Moving between the Work section and a project. The page is not handed to the browser's view
   transitions (Safari drops the WebGL background from those, so it went blank and popped back).
   Instead the page does it itself, and the background is never touched:
   1. A copy of the page you're leaving sits on top and fades away quickly.
   2. The project's artwork flies to its new spot and size, its box reshaping behind it.
   3. The new page, already in place underneath, eases in as the artwork lands.
   4. Only then do the floating controls (the tabs, or the back button) come in. */
.wash{background:var(--paper)}
#xf{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;contain:strict}
#xf>.wrap{position:absolute;margin:0;max-width:none;box-sizing:border-box}
#xf .xf-box,#xf .xf-dev{position:fixed;left:0;top:0;margin:0;transform-origin:0 0;will-change:transform,opacity}
#xf .xf-box{background:var(--stage)}
#xf .xf-dev{flex:none;max-width:none}
/* The exact frame a video was showing, held in place while the page changes over. */
.xf-frame{position:absolute;inset:0;z-index:2;display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
/* The floating controls wait out the page change, then ease in. */
.tabs-in.wait,.navback.wait{opacity:0;transform:translate3d(0,-6px,0)}
.tabs-in.reveal,.navback.reveal{transition:opacity .4s var(--ease),transform .5s var(--ease)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  .device video{opacity:1}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  .wash i{animation:none!important}
}
/* Display type: Hedvig Letters Serif is a single weight, so titles use 400 and never a synthesised bold. Its optical size runs 12 to 24, and titles use the top of that range. */
:root{--display:"Hedvig Letters Serif","Iowan Old Style","Georgia",serif}
.hero h1.intro-line,.hero h1,.intro h1,.sp-card h2,.panel .about-head h2,.about-head h1,.viewer-text h2,.card h2,.work-head h1,.chapter h2,.prow .pt{font-family:var(--display);font-weight:400;font-variation-settings:"opsz" 24}
.hero h1.intro-line{letter-spacing:-.012em;line-height:1.14}
.work-head h1,.about-head h1,.panel .about-head h2,.sp-card h2{letter-spacing:-.015em;line-height:1.06}
.card h2,.viewer-text h2{letter-spacing:-.01em}
.chapter h2{letter-spacing:-.005em;font-size:1.6rem}
.prow .pt{letter-spacing:0;font-size:1.3rem}

/* ---------- draft: new blocks ---------- */
.device.pic .scr{background:#e9e9ef}
.device.pic .still{object-fit:cover}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 20px;margin:10px 0}
.fgrid .fig{margin:0}
.stage.tile{padding:clamp(12px,2vw,22px);border-radius:16px;min-height:0}
.fgrid figcaption b{color:var(--ink);font-weight:600}
@media (max-width:720px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.tbl{border-collapse:collapse;width:100%;max-width:44em;margin:6px 0;font-size:.98rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.85rem;padding:0 16px 8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 16px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:600;width:48%}
.mdl{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(14px,2.4vw,28px);align-items:start;background:var(--stage);border-radius:20px;padding:clamp(18px,3.4vw,36px);color:#ececf6}
.mdl-arrow{align-self:center;color:#918bff;padding-top:28px}
@media (max-width:760px){.mdl{grid-template-columns:minmax(0,1fr)}.mdl-arrow{transform:rotate(90deg);justify-self:center;padding:0}}
.mdl-h{margin:0 0 12px;font-weight:600;font-size:.95rem}
.mdl-c{margin:14px 0 0;font-size:.86rem;color:#a0a2ba;line-height:1.45}
.sx{position:relative;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.sx-l{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;font-weight:600;color:#c9cadb;margin-bottom:8px}
.sx-l em{font-style:normal;font-weight:500;color:#918bff}
.sx.doc{padding:10px}
.sx-pages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sx.page{padding:10px;background:rgba(255,255,255,.04);display:grid;gap:5px;align-content:start}
.sx.page .sx-l{margin-bottom:2px}
.sx-b{display:block;font-style:normal;font-size:.64rem;line-height:18px;padding:0 5px;border-radius:4px;color:#0c0c18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx-b.bg,.sx-bar.bg{background:linear-gradient(160deg,#5b5f86,#34365a);color:#ececf6}
.sx-b.t,.sx-bar.t{background:#7fdde6}
.sx-b.g,.sx-bar.g{background:#c7b8f5}
.sx-bar.a{background:#6a3fd1;color:#fff}
.sx.page.one{padding:10px}
.sx-tl{display:grid;gap:6px}
.sx-row{position:relative;height:20px;border-radius:4px;background:rgba(255,255,255,.04)}
.sx-row.scenes{height:30px}
.sx-doca{margin-top:8px}
.sx-row.sm{height:18px}
.sx-row.sm .sx-bar span{line-height:18px;font-size:.62rem;padding:0 5px}
.sx.page .sx-row{background:rgba(255,255,255,.03)}
.sx-bar{position:absolute;top:0;bottom:0;border-radius:4px;overflow:hidden;color:#0c0c18;font-style:normal}
.sx-bar span{display:block;font-size:.66rem;line-height:20px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx-row.scenes .sx-bar span{line-height:30px}
.phbox{display:grid;place-items:center;aspect-ratio:16/9;border:1.5px dashed var(--line);border-radius:20px;background:color-mix(in srgb,var(--stage) 6%,transparent);padding:24px;text-align:center;color:var(--muted);font-size:.95rem}
.pgrp{list-style:none;font-size:.72rem;font-weight:600;letter-spacing:.02em;color:var(--muted);opacity:.75;margin:14px 0 0;padding:0}
.plist .pgrp:first-child{margin-top:0}
.prow{padding:7px 0}

/* ---------- draft: review layer ---------- */
.chapter .body .rv{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-width:0}
.rv-bar{margin:0!important}
.rv{position:relative;outline:1.5px dashed color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:8px;border-radius:6px;margin:22px 0}
.rv.rv-input{outline-color:#d98a12}
.rv[data-state=accepted]{outline-style:solid;outline-color:color-mix(in srgb,#1f9d6b 60%,transparent)}
.rv[data-state=returned]{outline-style:solid;outline-color:#d0453a}
.rv[data-state=revised]{outline-color:#d98a12}
.rv[data-state=revised]>.rv-bar .rv-tag::after{content:" \00b7  revised, please re-check"}
.rv .rv{outline-offset:4px}
.rv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:500 .78rem/1.35 system-ui,sans-serif;margin:0 0 10px;color:var(--muted)}
.rv-tag{background:var(--accent);color:var(--accent-ink,#fff);border-radius:999px;padding:2px 9px;font-weight:600}
.rv-input>.rv-bar .rv-tag{background:#d98a12;color:#fff}
.rv-what{flex:1 1 16em}
.rv-acts{display:inline-flex;gap:4px}
.rv-acts button,.rv-vd button{font:inherit;font-size:.76rem;border:1px solid var(--line);background:var(--paper,#fff);color:var(--ink);border-radius:7px;padding:3px 9px;cursor:pointer}
.rv-acts button[aria-pressed=true][data-d=accepted]{background:#1f9d6b;border-color:#1f9d6b;color:#fff}
.rv-acts button[aria-pressed=true][data-d=returned]{background:#d0453a;border-color:#d0453a;color:#fff}
.rv-note{width:100%;font:inherit;font-size:.82rem;color:var(--ink);background:var(--paper,#fff);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:48px;resize:vertical}
.rv-vd{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 0;font:500 .76rem/1.3 system-ui,sans-serif;color:var(--muted)}
.rv-src{margin-right:4px}
.rv-vd button[aria-pressed=true][data-v=ship]{background:#1f9d6b;border-color:#1f9d6b;color:#fff}
.rv-vd button[aria-pressed=true][data-v=polish]{background:#d98a12;border-color:#d98a12;color:#fff}
.rv-vd button[aria-pressed=true][data-v=cut]{background:#d0453a;border-color:#d0453a;color:#fff}
.rv-vd .rv-note{flex-basis:100%}
.rv-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
body.rv-off .rv{outline:0;margin:0}
body.rv-off .chapter .body .rv{margin:0}
body.rv-off .rv-bar,body.rv-off .rv-vd,body.rv-off .rv-dot{display:none}
.rvp{position:fixed;right:var(--gutter);bottom:calc(var(--gutter) + 64px);z-index:60;font:500 .85rem/1.4 system-ui,sans-serif;color:var(--ink);max-width:min(380px,calc(100vw - 2*var(--gutter)))}
.rvp-tog{display:flex;align-items:center;gap:8px;margin-left:auto;font:inherit;font-weight:600;border:1px solid var(--primary);border-radius:12px;padding:9px 14px;background:color-mix(in srgb,var(--paper,#fff) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);cursor:pointer}
.rvp-tog b{font-variant-numeric:tabular-nums;color:var(--primary)}
.rvp-dot{width:8px;height:8px;border-radius:50%;background:#d98a12}
.rvp-body{margin-top:8px;max-height:min(70vh,640px);overflow:auto;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--paper,#fff);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.rvp-lead{margin:0 0 6px;font-weight:600}
.rvp-stats,.rvp-sync,.rvp-pub{margin:0 0 6px;color:var(--muted);font-size:.8rem}
.rvp-h{margin:14px 0 6px;font-size:.72rem;font-weight:700;color:var(--muted)}
.rvp-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rvp-list li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.8rem}
.rvp-list li>span{flex:none;color:var(--muted)}
.rvp-list li.accepted>span,.rvp-list li.ship>span{color:#1f9d6b}
.rvp-list li.returned>span,.rvp-list li.cut>span{color:#d0453a}
.rvp-list li.polish>span{color:#d98a12}
.rvp-list a{color:var(--ink);text-decoration:none}
.rvp-list a:hover{color:var(--primary)}
.rvp-rm{display:grid;gap:4px}.rvp-rm small{color:var(--muted)}
.rvp-hide{display:flex;gap:8px;align-items:center;margin:14px 0 10px;font-size:.8rem}
.rvp-ready{width:100%;font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--primary);color:var(--primary-ink);cursor:pointer}
</style>

        { title: "The problem", blocks: [
          { p: "Canva's first video editor treated a video as a stack of pages, like a slideshow with a play button. The new model put everything on one page, so every element got its own timing on a multi-track timeline. That was a big step up in power, and a new idea to learn: a main track with layers above it, which the old page controls didn't map onto." },

  /* ---------- Fallback grain veil (only used without WebGL) ---------- */
  function veil(){
    const el = document.querySelector('.veil');

    const dpr = Math.min(3, window.devicePixelRatio || 1), n = 256;
    const cv = document.createElement('canvas'); cv.width = cv.height = n;
    const x = cv.getContext('2d'), d = x.createImageData(n, n), v = parseInt(paper.slice(1), 16);
    for (let i = 0; i < n * n; i++) {
      d.data[i * 4] = v >> 16 & 255; d.data[i * 4 + 1] = v >> 8 & 255; d.data[i * 4 + 2] = v & 255;

  }

  /* ---------- Drifting particle grain (kept, off) ---------- */
  function alloc(n){
    N = n;
    X = new Float32Array(n); Y = new Float32Array(n); S = new Float32Array(n); A = new Float32Array(n);
    V = new Float32Array(n); D = new Float32Array(n); B = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      X[i] = Math.random() * (w + 2 * M) - M; Y[i] = Math.random() * (h + 2 * M) - M;
      const r = Math.random();
      S[i] = 0.75 + r * r * 0.75;           // fine, with a little variation
      A[i] = 0.45 + Math.random() * 0.55;
      V[i] = 0.55 + Math.random() * 0.9;
      D[i] = Math.random();
    }
  }
  function size(){
    // On phones the browser's toolbar slides in and out as pages change and scroll, which changes
    // the window height. The background keeps the tallest height seen at this width, so that
    // never clears it or shifts the glows; only a real change (rotating, resizing) redraws it.
    // The height is the canvas's own height on screen (the tallest, toolbar-hidden viewport on
    // phones), so what it draws is never stretched to fit.
    const coarse = matchMedia('(pointer: coarse)').matches, nw = window.innerWidth;
    const nh = Math.round(fxc.getBoundingClientRect().height) || window.innerHeight;
    if (coarse && nw === w && nh === h) return false;
    w = nw; h = nh;
    if (fx) { dprFx = Math.min(coarse ? 1 : 2, window.devicePixelRatio || 1); fxc.width = Math.round(w * dprFx); fxc.height = Math.round(h * dprFx); }

    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gw = Math.ceil(w / G) + 3; gh = Math.ceil(h / G) + 3;
    PS = new Float32Array(gw * gh); VX = new Float32Array(gw * gh); VY = new Float32Array(gw * gh);
    WV = new Float32Array(gw * gh); HU = new Float32Array(gw * gh);
    const want = Math.max(4000, Math.min(40000, Math.round(w * h / 36)));

  function fields(t){
    const f = 0.0019 * G;
    for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
      const i = gy * gw + gx, x = (gx - 1) * f, y = (gy - 1) * f;
      PS[i] = noise(x, y, t * 0.05) + 0.5 * noise(x * 2.1 + 30, y * 2.1 + 30, t * 0.075);
      WV[i] = noise(x * 1.3 + 60, y * 1.3 + 60, t * 0.09);
      HU[i] = noise(x * 0.7 + 120, y * 0.7 + 120, t * 0.05);
    }
    const K = 520;                            // sets typical drift speed, in px per second
    for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
      const i = gy * gw + gx;
      const up = PS[(gy > 0 ? gy - 1 : gy) * gw + gx], dn = PS[(gy < gh - 1 ? gy + 1 : gy) * gw + gx];
      const lf = PS[gy * gw + (gx > 0 ? gx - 1 : gx)], rt = PS[gy * gw + (gx < gw - 1 ? gx + 1 : gx)];

  function grainStep(dt){
    fields(clock);
    for (let i = 0; i < N; i++) {
      const fx = X[i] / G + 1, fy = Y[i] / G + 1, x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0;
      const i00 = y0 * gw + x0, i10 = i00 + 1, i01 = i00 + gw, i11 = i01 + 1;

      let y = Y[i] + (VY[i00] * w00 + VY[i10] * w10 + VY[i01] * w01 + VY[i11] * w11) * V[i] * dt;

      if (x < -M || x >= w + M || y < -M || y >= h + M) { x = Math.random() * (w + 2 * M) - M; y = Math.random() * (h + 2 * M) - M; }

      let k = ((WV[i00] * w00 + WV[i10] * w10 + WV[i01] * w01 + WV[i11] * w11) - 0.3) / 0.4;

  }

  /* ---------- Glows ----------
     Each glow gets its own slow, non-repeating path: it drifts, turns, tilts on two axes, leans
     and stretches, and fades up and down. While the black hole is open each glow is also drawn
     onto it, spinning and dimming as it falls. A swallowed glow is replaced by a fresh one

  const pull = new Array(NB).fill(0), born = new Array(NB).fill(9), keyOff = new Array(NB).fill(0);
  const ez = v => { v = v < 0 ? 0 : v > 1 ? 1 : v; return v * v * (3 - 2 * v); };

    const on = hActive || drag, E = 0.84 * Math.max(w, h);

      if (on && pull[i] >= 1) { keyOff[i] += 13.7 + Math.random() * 40; pull[i] = 0; born[i] = 0; }

      let x = ((n(0, 0.022, 3) - 0.5) * 1.9 + 0.5) * w, y = ((n(40, 0.022, 9) - 0.5) * 1.9 + 0.5) * h, way = 0;

      }

      const turn = (n(80, 0.016, 5) - 0.5) * 420 + inn * 90, ax = (n(120, 0.028, 7) - 0.5) * 90, ay = (n(160, 0.028, 11) - 0.5) * 90;
      const lean = (n(200, 0.03, 13) - 0.5) * 36;
      const sx = 0.75 + 0.6 * n(240, 0.032, 15), sy = 0.75 + 0.6 * n(280, 0.032, 17);

      // With a hole open everything is a little denser, and the two extra clouds fade in.
      const gone = u > 0.95 ? 1 - (u - 0.95) / 0.05 : 1, extra = i < 4 ? 1 : hs;

      if (fx) {

        const cs = Math.cos(turn * RAD), sn = Math.sin(turn * RAD), tn = Math.tan(lean * RAD), qx = Math.cos(ay * RAD), qy = Math.cos(ax * RAD);

          // and stays long along it, so it wraps the edge as a thin stream before it drops.

          const wc = Math.cos(way), ws = Math.sin(way);

          const a2 = t00 * a + t01 * cc, b2 = t00 * b + t01 * d, c2 = t01 * a + t11 * cc, d2 = t01 * b + t11 * d;

        BM[i * 4] = d / det; BM[i * 4 + 1] = -cc / det; BM[i * 4 + 2] = -b / det; BM[i * 4 + 3] = a / det;
      } else if (blobs[i]) {
        blobs[i].style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) perspective(1400px) rotateX(' + ax.toFixed(2) + 'deg) rotateY(' + ay.toFixed(2) + 'deg) rotate(' + turn.toFixed(2) + 'deg) skewX(' + lean.toFixed(2) + 'deg) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';
        blobs[i].style.opacity = op.toFixed(3);
      }
    }
  }

  /* ---------- Easter egg ----------
     Rest the cursor on empty background for ten seconds and a black hole grows there from a
     pinpoint to 100px across. The glows and their grain bend, swirl and pour into it. Move the
     cursor away and it shrinks back to nothing. Press on the hole and drag to carry it around. */
  const BG = 'html,body,.wrap,main,.home,.hero,.tabs,.tabs-in,.panel,.plist,#vstage,.reel,.viewer,.viewer-text,article,.work-head,.hero,.fig,.chapters,.chapter,.chapter>.body,.about-head,.bio,.foot,.cards,.quotes';
  // On touch screens the hole opens bigger, so its edge shows clearly around a fingertip.
  const HOLD = 10000, LONG = 550, SIZE = matchMedia('(pointer: coarse)').matches ? 76 : 50, GROW = 1.6, SHRINK = 0.9;
  let hActive = false, drag = false, hs = 0, hl = 0, hx = 0, hy = 0, tx = 0, ty = 0, hR = 0;
  let aX = -9999, aY = -9999, aT = 0, aOK = false;
  function holeUpdate(dt){
    if (!fx) return;
    if (!hActive && !drag && aOK && hl < 0.02 && performance.now() - aT > HOLD) { hActive = true; hx = tx = aX; hy = ty = aY; }
    const on = hActive || drag;
    hl = on ? Math.min(1, hl + dt / GROW) : Math.max(0, hl - dt / SHRINK);
    hs = hl * hl * (3 - 2 * hl);
    hR = SIZE * hs;

    root.classList.toggle('hole-on', on && hl > 0.5);

  function step(dt, quiet){
    clock += dt;
    if (!reduce) holeUpdate(dt);
    if (!reduce || fx) glows(clock, reduce ? 0 : dt);

    raf = requestAnimationFrame(frame);

    last = now;

    // The glows move slowly, so the background simply holds still while the page scrolls or
    // animates, leaving the frame budget to the content.
    // While the page is busy (scrolling, changing page) the background holds completely still:
    // its clock stops too, so it carries on from the same spot afterwards instead of jumping ahead.
    if (!GRAIN && hl === 0 && now < window.LR.calmUntil) return;
    const quiet = !GRAIN && hl === 0 && (++tick & 1) === 1;
    const t0 = performance.now();

  const stop = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };

  fx = initGL();

    root.classList.add('fx');
    fxc.addEventListener('webglcontextlost', e => { e.preventDefault(); fx = false; root.classList.remove('fx', 'hole-on', 'hole-drag'); hl = hs = 0; hActive = drag = false; veil(); });
  }

  if (scheme.addEventListener) scheme.addEventListener('change', () => { colours(); veil(); step(0); });

  // opening beside the text takes them by surprise.

  const rest = ok => { aT = performance.now(); hActive = false; if (ok === false) aOK = false; };

    if (!drag) return;
    drag = false; root.classList.remove('hole-drag');
    if (e && e.clientX !== undefined) { aX = tx = e.clientX; aY = ty = e.clientY; }
    aOK = true; hActive = true;               // it stays while the cursor rests on it
  };
  window.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    if (drag) { tx = aX = e.clientX; ty = aY = e.clientY; return; }
    const dx = e.clientX - aX, dy = e.clientY - aY;
    if (dx * dx + dy * dy < 36) return;       // ignore hand tremor
    aX = e.clientX; aY = e.clientY;
    aOK = onHome() && !!(e.target && e.target.matches && e.target.matches(BG));
    rest();
    if (hl > 0) { tx = e.clientX; ty = e.clientY; }   // a shrinking hole trails the cursor
  }, { passive: true });

  // the finger while held. Lifting the finger lets it shrink away. A scroll or swipe cancels it.
  let pressT = 0, pressX = 0, pressY = 0, tHeld = false;
  const clearPress = () => { clearTimeout(pressT); pressT = 0; };
  const letGo = () => { clearPress(); if (!tHeld) return; tHeld = false; root.classList.remove('hole-drag'); rest(); };
  const openAt = (x, y) => {
    tHeld = true; aX = tx = x; aY = ty = y;

})();
</script>
<script>
(function(){
  const FLAGS = { splash: true };
  // The hero waits hidden (see pre-enter) and rises in as the splash clears, or straight away with no splash.
  const root = document.documentElement;
  const enter = () => {
    if (!root.classList.contains('pre-enter')) return;
    root.classList.add('entering');
    // Two frames lets the hidden state paint first so the rise animates; the timer is a fallback.
    const show = () => root.classList.remove('pre-enter');
    requestAnimationFrame(() => requestAnimationFrame(show)); setTimeout(show, 60);
    setTimeout(() => root.classList.remove('entering'), 1600);
  };
  const box = document.getElementById('splash'); if (!box || !FLAGS.splash) { enter(); return; }
  const tpl = document.getElementById('logo-tpl'), ok = document.getElementById('sp-ok');
  document.getElementById('sp-mark').innerHTML = tpl ? tpl.innerHTML : '';
  document.body.appendChild(box); // keep it outside the page wrapper so it is not made inert with it
  const sib = [...document.body.children].filter(e => e !== box && e.tagName !== 'SCRIPT' && e.tagName !== 'TEMPLATE');
  sib.forEach(e => e.setAttribute('inert', ''));
  box.hidden = false; document.body.classList.add('splash-open');
  // Focus the dialog itself, not the button, so no focus ring shows on load. Tab still lands on the button.
  box.querySelector('.sp-card').focus({ preventScroll: true });
  const close = () => {
    document.removeEventListener('keydown', key);
    sib.forEach(e => e.removeAttribute('inert')); document.body.classList.remove('splash-open');
    enter();
    const done = () => { box.hidden = true; };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) done(); else { box.classList.add('out'); setTimeout(done, 800); }
  };
  const key = e => { if (e.key === 'Escape') close(); else if (e.key === 'Tab') { e.preventDefault(); ok.focus(); } };
  document.addEventListener('keydown', key); ok.addEventListener('click', close);
})();
</script>
